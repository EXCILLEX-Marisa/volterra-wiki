    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="980" fill="#F8FAFC"/>

  <!-- Top Header Card -->
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="176" height="28" rx="6" fill="#0F172A"/>
  <text x="156.0" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 01-01 · 数学同源映射</text>
  <text x="260" y="70" font-size="27" font-weight="bold" fill="#0F172A">Taylor 级数与 Volterra 级数关系图（从标量函数导数到有记忆泛函核张量）</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">展示 0～3 阶展开的几何升维路径（点 → 向量 → 矩阵 → 立方体张量）以及复平面极点决定的收敛半径边界 R_c</text>


  <!-- Left Column: Taylor Series -->
    <rect x="48" y="144" width="580" height="738" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="144" width="580" height="54" rx="14" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="48" y="186" width="580" height="12" fill="#FEF3C7"/>
  <line x1="48" y1="198" x2="628" y2="198" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="68" y="168" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="68" y="188" font-size="12.5" fill="{dark}">{subtitle}</text>

  <!-- Right Column: Volterra Series -->
    <rect x="972" y="144" width="580" height="738" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="972" y="144" width="580" height="54" rx="14" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="972" y="186" width="580" height="12" fill="#EDE9FE"/>
  <line x1="972" y1="198" x2="1552" y2="198" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="992" y="168" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="992" y="188" font-size="12.5" fill="{dark}">{subtitle}</text>

  <!-- Center Column: Dimension Lifting & Complex Plane Convergence -->
    <rect x="648" y="144" width="304" height="738" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="648" y="144" width="304" height="54" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="648" y="186" width="304" height="12" fill="#F1F5F9"/>
  <line x1="648" y1="198" x2="952" y2="198" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="668" y="168" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="668" y="188" font-size="12.5" fill="{dark}">{subtitle}</text>

  <!-- Row 0: 0th Order -->
  <rect x="68" y="214" width="540" height="122" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="86" y="240" font-size="15.5" font-weight="bold" fill="#92400E">0 阶常数项：c₀ = f(0)</text>
  <text x="86" y="266" font-size="13.5" fill="#475569">• 数学结构：标量常数（0 维单点）</text>
  <text x="86" y="290" font-size="13.5" fill="#475569">• 物理含义：静态工作点偏移 / 固定直流偏置</text>
  <text x="86" y="314" font-size="13" fill="#B45309">• 几何维度：dim = 1（单一标量参数）</text>
  <!-- Mini plot 0D -->
  <rect x="454" y="226" width="140" height="96" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
  <line x1="468" y1="296" x2="580" y2="296" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="524" y1="238" x2="524" y2="310" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="468" y1="262" x2="580" y2="262" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="524" cy="262" r="5" fill="#D97706"/>
  <text x="524" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400E">c₀ = f(0)</text>

  <!-- Row 0 Right -->
  <rect x="992" y="214" width="540" height="122" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="1010" y="240" font-size="15.5" font-weight="bold" fill="#0F172A">0 阶核：h₀</text>
  <text x="1010" y="266" font-size="13.5" fill="#475569">• 数学结构：常数偏置项 y₀[n] = h₀</text>
  <text x="1010" y="290" font-size="13.5" fill="#475569">• 物理含义：系统无输入时的稳态直流偏置点</text>
  <text x="1010" y="314" font-size="13" fill="#334155">• 独立参数量：1（与时间索引 n 无关）</text>
  <rect x="1378" y="226" width="140" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <line x1="1392" y1="296" x2="1504" y2="296" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="1392" y1="262" x2="1504" y2="262" stroke="#475569" stroke-width="2.5"/>
  <circle cx="1420" cy="262" r="4" fill="#475569"/><circle cx="1448" cy="262" r="4" fill="#475569"/><circle cx="1476" cy="262" r="4" fill="#475569"/>
  <text x="1448" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">y₀[n] ≡ h₀</text>

  <!-- Row 1: 1st Order -->
  <rect x="68" y="352" width="540" height="132" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="86" y="378" font-size="15.5" font-weight="bold" fill="#92400E">1 阶线性项：c₁ · x[n] = f′(0) · x[n]</text>
  <text x="86" y="404" font-size="13.5" fill="#475569">• 数学结构：单标量斜率 c₁（无延迟记忆）</text>
  <text x="86" y="428" font-size="13.5" fill="#475569">• 物理含义：原点切线增益（纯静态线性放大）</text>
  <text x="86" y="452" font-size="13" fill="#B45309">• 退化关系：h₁[k] = c₁ · δ[k] 时退化为 Taylor 1 阶</text>
  <!-- Mini plot 1D tangent -->
  <rect x="454" y="364" width="140" height="106" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
  <line x1="468" y1="417" x2="580" y2="417" stroke="#94A3B8" stroke-width="1"/>
  <line x1="524" y1="374" x2="524" y2="460" stroke="#94A3B8" stroke-width="1"/>
  <line x1="478" y1="452" x2="570" y2="382" stroke="#D97706" stroke-width="2.5"/>
  <text x="524" y="390" font-size="11" font-weight="bold" fill="#92400E">斜率 c₁</text>

  <!-- Row 1 Right -->
  <rect x="992" y="352" width="540" height="132" rx="10" fill="#F0F9FF" stroke="#BAE6FD"/>
  <text x="1010" y="378" font-size="15.5" font-weight="bold" fill="#075985">1 阶 Volterra 核：∑ h₁[k] · x[n-k]</text>
  <text x="1010" y="404" font-size="13.5" fill="#475569">• 数学结构：1 维脉冲响应向量 h₁ ∈ ℝ^M</text>
  <text x="1010" y="428" font-size="13.5" fill="#475569">• 物理含义：LTI 线性滤波（EQ 频响与群延迟相位）</text>
  <text x="1010" y="452" font-size="13" fill="#0369A1">• 独立参数量：M（记忆长度 M 拍）</text>
  <!-- Mini plot FIR stems -->
  <rect x="1378" y="364" width="140" height="106" rx="8" fill="#FFFFFF" stroke="#7DD3FC"/>
  <line x1="1390" y1="442" x2="1506" y2="442" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="1404" y1="442" x2="1404" y2="382" stroke="#0284C7" stroke-width="2.5"/><circle cx="1404" cy="382" r="3.5" fill="#0284C7"/>
  <line x1="1422" y1="442" x2="1422" y2="402" stroke="#0284C7" stroke-width="2.5"/><circle cx="1422" cy="402" r="3.5" fill="#0284C7"/>
  <line x1="1440" y1="442" x2="1440" y2="456" stroke="#0284C7" stroke-width="2.5"/><circle cx="1440" cy="456" r="3.5" fill="#0284C7"/>
  <line x1="1458" y1="442" x2="1458" y2="422" stroke="#0284C7" stroke-width="2.5"/><circle cx="1458" cy="422" r="3.5" fill="#0284C7"/>
  <line x1="1476" y1="442" x2="1476" y2="434" stroke="#0284C7" stroke-width="2.5"/><circle cx="1476" cy="434" r="3.5" fill="#0284C7"/>
  <line x1="1494" y1="442" x2="1494" y2="439" stroke="#0284C7" stroke-width="2.5"/><circle cx="1494" cy="439" r="3.5" fill="#0284C7"/>
  <text x="1465" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#075985">1D 向量 h₁[k]</text>

  <!-- Row 2: 2nd Order -->
  <rect x="68" y="500" width="540" height="148" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="86" y="526" font-size="15.5" font-weight="bold" fill="#92400E">2 阶二次项：c₂ · x²[n] = ½ f′′(0) · x²[n]</text>
  <text x="86" y="552" font-size="13.5" fill="#475569">• 数学结构：单标量曲率系数 c₂</text>
  <text x="86" y="576" font-size="13.5" fill="#475569">• 物理含义：无记忆静态平方非对称失真（偶次谐波）</text>
  <text x="86" y="600" font-size="13" fill="#B45309">• 局限：偶次谐波包络无法随频率动态滚降</text>
  <text x="86" y="624" font-size="12.5" fill="#92400E">• 对应核切片：仅非零于原点 h₂[0,0] = c₂</text>
  <!-- Mini plot Parabola -->
  <rect x="454" y="514" width="140" height="120" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
  <line x1="468" y1="606" x2="580" y2="606" stroke="#94A3B8" stroke-width="1"/>
  <line x1="524" y1="526" x2="524" y2="620" stroke="#94A3B8" stroke-width="1"/>
  <path d="M 476 538 Q 524 674 572 538" fill="none" stroke="#D97706" stroke-width="2.5"/>
  <text x="524" y="546" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">c₂·x²[n]</text>

  <!-- Row 2 Right -->
  <rect x="992" y="500" width="540" height="148" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="1010" y="526" font-size="15.5" font-weight="bold" fill="#5B21B6">2 阶 Volterra 核：∑∑ h₂[k₁,k₂] · x[n-k₁]x[n-k₂]</text>
  <text x="1010" y="552" font-size="13.5" fill="#475569">• 数学结构：2 维对称核矩阵 H₂ ∈ ℝ^(M×M)</text>
  <text x="1010" y="576" font-size="13.5" fill="#475569">• 主对角线 k₁=k₂：广义 Hammerstein 平方支路</text>
  <text x="1010" y="600" font-size="13.5" fill="#475569">• 非对角线 k₁≠k₂：不同延迟时刻的双线性交叉乘积</text>
  <text x="1010" y="624" font-size="13" fill="#6D28D9">• 独立参数量：M(M+1)/2（上三角折叠 k₁ ≤ k₂）</text>
  <!-- Mini plot 2D matrix -->
  <rect x="1378" y="514" width="140" height="120" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/>
  <rect x="1398" y="534" width="84" height="84" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.2"/>
  <polygon points="1398,534 1482,534 1482,618" fill="#DDD6FE" opacity="0.8"/>
  <line x1="1398" y1="534" x2="1482" y2="618" stroke="#D97706" stroke-width="3"/>
  <circle cx="1454" cy="556" r="4.5" fill="#7C3AED"/>
  <circle cx="1468" cy="580" r="4.5" fill="#7C3AED"/>
  <text x="1448" y="528" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5B21B6">2D 矩阵 h₂[k₁,k₂]</text>

  <!-- Row 3: 3rd Order -->
  <rect x="68" y="664" width="540" height="198" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="86" y="690" font-size="15.5" font-weight="bold" fill="#92400E">3 阶及 P 阶项：c₃ · x³[n] = (1/6) f′′′(0) · x³[n]</text>
  <text x="86" y="716" font-size="13.5" fill="#475569">• 数学结构：单标量系数 c₃（以至 c_P）</text>
  <text x="86" y="740" font-size="13.5" fill="#475569">• 物理含义：对称软削波压缩（3 次奇次谐波 + IMD3）</text>
  <text x="86" y="764" font-size="13.5" fill="#DC2626" font-weight="bold">• 收敛半径硬瓶颈：以 f(x)=tanh(g·x) 为例，复平面奇点</text>
  <text x="100" y="786" font-size="13" fill="#991B1B">位于 z = ±jπ/(2g)，收敛半径 R_c = π/(2g) ≈ 1.57/g；</text>
  <text x="100" y="808" font-size="13" fill="#991B1B">一旦峰值 |x| &gt; R_c，高阶 Taylor 截断在边界外剧烈发散！</text>
  <text x="86" y="838" font-size="12.5" fill="#B45309">• 工程对策：采用 [L/M] Padé 有理逼近扩展渐近饱和区</text>
  <!-- Mini plot Cubic -->
  <rect x="454" y="678" width="140" height="114" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
  <line x1="468" y1="735" x2="580" y2="735" stroke="#94A3B8" stroke-width="1"/>
  <line x1="524" y1="688" x2="524" y2="782" stroke="#94A3B8" stroke-width="1"/>
  <path d="M 474 770 C 504 770, 504 735, 524 735 C 544 735, 544 700, 574 700" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="3 2"/>
  <path d="M 478 780 C 500 755, 508 735, 524 735 C 540 735, 548 715, 570 690" fill="none" stroke="#D97706" stroke-width="2.5"/>
  <text x="524" y="702" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400E">x - g²x³/3</text>

  <!-- Row 3 Right -->
  <rect x="992" y="664" width="540" height="198" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="1010" y="690" font-size="15.5" font-weight="bold" fill="#5B21B6">3 阶 Volterra 核：∑∑∑ h₃[k₁,k₂,k₃] · x[n-k₁]x[n-k₂]x[n-k₃]</text>
  <text x="1010" y="716" font-size="13.5" fill="#475569">• 数学结构：3 维对称张量 H₃ ∈ ℝ^(M×M×M)</text>
  <text x="1010" y="740" font-size="13.5" fill="#475569">• 物理含义：动态奇次失真、包络依赖压缩与三音互调</text>
  <text x="1010" y="764" font-size="13.5" fill="#DC2626" font-weight="bold">• 维度灾难瓶颈：独立参数 N₃ = M(M+1)(M+2)/6 ∼ O(M³)</text>
  <text x="1024" y="786" font-size="13" fill="#991B1B">当 M = 64 时 N₃ = 45,760；当 M = 256 时 N₃ = 2,818,048！</text>
  <text x="1010" y="814" font-size="13" fill="#059669" font-weight="bold">• 降维出路：对角剪枝 (|k₁-k₂|≤D) + Laguerre 正交基展开</text>
  <text x="1010" y="838" font-size="12.5" fill="#5B21B6">• Gâteaux 泛函导数联系：h_p = (1/p!) D^p H[0]</text>
  <!-- Mini plot 3D Cube -->
  <rect x="1378" y="678" width="140" height="114" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/>
  <polygon points="1404,720 1454,720 1454,770 1404,770" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <polygon points="1404,720 1428,698 1478,698 1454,720" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5"/>
  <polygon points="1454,720 1478,698 1478,748 1454,770" fill="#C4B5FD" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="1404" y1="720" x2="1478" y2="748" stroke="#D97706" stroke-width="2.5"/>
  <text x="1448" y="785" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5B21B6">3D 张量 H₃</text>

  <!-- Center Column Content: Mapping Arrows & Convergence Circle -->
  <rect x="666" y="214" width="268" height="70" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="800" y="242" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0F172A">0D 标量 ≡ 0D 常数核</text>
  <text x="800" y="266" text-anchor="middle" font-size="12.5" fill="#475569">c₀  ⟷  h₀  (1 参数)</text>

  <rect x="666" y="362" width="268" height="90" rx="8" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="800" y="390" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#075985">标量导数 → 1D 向量</text>
  <text x="800" y="414" text-anchor="middle" font-size="12.5" fill="#0369A1">1 参数 → M 参数</text>
  <text x="800" y="436" text-anchor="middle" font-size="12" fill="#075985">引入历史记忆轴 k₁ ∈ [0, M-1]</text>

  <rect x="666" y="514" width="268" height="106" rx="8" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="800" y="542" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5B21B6">二阶导数 → 2D 矩阵</text>
  <text x="800" y="566" text-anchor="middle" font-size="12.5" fill="#6D28D9">1 参数 → M(M+1)/2 参数</text>
  <text x="800" y="588" text-anchor="middle" font-size="12" fill="#5B21B6">引入跨时刻交叉积 k₁ × k₂</text>
  <text x="800" y="608" text-anchor="middle" font-size="11.5" fill="#475569">退化：h₂[k₁,k₂]=c₂δ[k₁]δ[k₂]</text>

  <!-- Complex Plane Pole Circle inside Center Column bottom -->
  <rect x="666" y="644" width="268" height="218" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="800" y="668" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#991B1B">复平面极点与收敛圆 R_c</text>
  <line x1="720" y1="744" x2="880" y2="744" stroke="#64748B" stroke-width="1.2"/>
  <line x1="800" y1="684" x2="800" y2="804" stroke="#64748B" stroke-width="1.2"/>
  <circle cx="800" cy="744" r="44" fill="#FEE2E2" fill-opacity="0.55" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Poles at +/- j pi / (2g) -->
  <text x="800" y="704" text-anchor="middle" font-size="14" font-weight="bold" fill="#DC2626">✕</text>
  <text x="800" y="794" text-anchor="middle" font-size="14" font-weight="bold" fill="#DC2626">✕</text>
  <text x="845" y="704" font-size="11" font-weight="bold" fill="#991B1B">+jπ/(2g)</text>
  <text x="845" y="792" font-size="11" font-weight="bold" fill="#991B1B">-jπ/(2g)</text>
  <text x="800" y="748" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">|z| &lt; R_c 收敛</text>
  <text x="800" y="828" text-anchor="middle" font-size="11.5" fill="#7F1D1D">实轴无奇点仍受虚轴极点限制</text>
  <text x="800" y="848" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991B1B">泛函收敛域：‖x‖_∞ &lt; R_c</text>


  <!-- Bottom Dark Summary Bar -->
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="15.5" font-weight="bold" fill="#F8FAFC">核心结论：Volterra 级数是带历史记忆的泛函 Taylor 展开；无记忆极限 h_p = c_p ∏ δ[k_i] 下严格退化为静态多项式，且同样受复平面极点收敛半径 R_c 制约。</text>
