<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="vBlur"/>
      <feOffset in="vBlur" dx="0" dy="3" result="vOffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#F8FAFC"/>

  
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="234" height="28" rx="6" fill="#0F172A"/>
  <text x="184.9" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 02-01 · 训练与推理范式对比</text>
  <text x="318" y="70" font-size="27" font-weight="bold" fill="#0F172A">Volterra 正交基灰盒辨识与神经网络 (NAM) 训练及实时推理全流程对比图</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">从特征构造、凸优化闭式求解 vs 非凸梯度下降、实时 SIMD 并行性到物理可解释性的全方位对照</text>


  
    <rect x="48" y="144" width="736" height="738" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="144" width="736" height="54" rx="14" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="48" y="186" width="736" height="12" fill="#FEF3C7"/>
  <line x1="48" y1="198" x2="784" y2="198" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="68" y="168" font-size="17" font-weight="bold" fill="#78350F">路线 A：Volterra / 正交基灰盒直接辨识范式</text>
  <text x="68" y="188" font-size="12.5" fill="#78350F">参数线性 (Linear-in-Parameters) · 凸优化闭式求解 · 结构透明</text>

  
    <rect x="816" y="144" width="736" height="738" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="816" y="144" width="736" height="54" rx="14" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="816" y="186" width="736" height="12" fill="#EDE9FE"/>
  <line x1="816" y1="198" x2="1552" y2="198" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="836" y="168" font-size="17" font-weight="bold" fill="#5B21B6">路线 B：神经网络黑盒端到端训练范式 (NAM: WaveNet / LSTM)</text>
  <text x="836" y="188" font-size="12.5" fill="#5B21B6">深度复合非线性 · 非凸随机梯度下降 (Adam + BPTT) · 高阶强耦合表征</text>

  
  <rect x="68" y="210" width="696" height="154" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="88" y="236" font-size="15" font-weight="bold" fill="#92400E">1. 数据与特征构造：显式构造回归矩阵 Φ(x)</text>
  <text x="88" y="262" font-size="12.5" fill="#334155">• 输入经固定基底（延迟线 / Laguerre / Legendre）展开</text>
  <text x="88" y="288" font-size="12.5" fill="#334155">• 预测输出 ŷ = Φ·θ 关于待估核参数 θ <tspan font-weight="bold" fill="#B45309">保持严格线性</tspan></text>
  <text x="88" y="314" font-size="12.5" fill="#334155">• 样本需求精简：5～30 秒多电平扫频或多正弦即可辨识</text>
  <rect x="520" y="224" width="224" height="122" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="632" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">显式特征映射 ŷ = Φ·θ</text>
  <text x="632" y="274" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#334155">[ φ₁(x) φ₂(x) … φ_K(x) ]</text>
  <text x="632" y="298" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#D97706">× [ θ₁, θ₂, …, θ_K ]ᵀ</text>
  <text x="632" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">基底固定，仅解线性权重</text>

  
  <rect x="68" y="378" width="696" height="176" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="88" y="404" font-size="15" font-weight="bold" fill="#065F46">2. 离线辨识求解：严格凸二次损失函数与一步闭式解</text>
  <text x="88" y="430" font-size="12.5" fill="#334155">• 目标函数：J(θ) = ‖y - Φθ‖₂² + ‖Γθ‖₂²（严格凸碗面）</text>
  <text x="88" y="454" font-size="12.5" fill="#334155">• 求解算法：QR / SVD / Cholesky <tspan font-weight="bold" fill="#059669">一步闭式求得全局最优解</tspan></text>
  <text x="88" y="478" font-size="12.5" fill="#334155">• 计算耗时：CPU 仅需 <tspan font-weight="bold" fill="#065F46">0.1 秒～数秒</tspan>，无随机初始化方差</text>
  <text x="88" y="502" font-size="12.5" fill="#334155">• 频域解析：对角核可由 ESS 逆滤波与 Chebyshev 变换直解</text>
  <text x="88" y="526" font-size="12" font-weight="bold" fill="#047857">• 可解释性：各阶核直接对应线性频响、谐波与双音互调面</text>
  
  <rect x="520" y="392" width="224" height="148" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="632" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#065F46">严格凸损失曲面 J(θ)</text>
  <path d="M 548 430 Q 632 566 716 430" fill="none" stroke="#059669" stroke-width="3"/>
  <ellipse cx="632" cy="430" rx="84" ry="14" fill="#D1FAE5" fill-opacity="0.5" stroke="#059669" stroke-dasharray="3 2"/>
  <circle cx="632" cy="498" r="6" fill="#DC2626"/>
  <text x="632" y="524" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991B1B">全局唯一闭式极小点 θ*</text>

  
  <rect x="68" y="568" width="696" height="294" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="88" y="594" font-size="15" font-weight="bold" fill="#0F172A">3. 实时音频推理 (processBlock) 与能力边界</text>
  <rect x="88" y="610" width="656" height="64" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="106" y="634" font-size="12.3" font-weight="bold" fill="#075985">数据流：x[n] → [线性 FIR / 分段 FFT] ⊕ [Laguerre 状态递推 + 低秩二次型] ⊕ [ADAA1 静态支路] → ŷ[n]</text>
  <text x="106" y="658" font-size="12.5" fill="#475569">计算特征：可跨音频块 (Block) 向量化并行，无跨层非线性递归依赖，单通道 CPU 占用 &lt; 1%～3%</text>
  <text x="88" y="702" font-size="13.5" font-weight="bold" fill="#059669">✓ 核心优势：相位与频响精度极高、旋钮插值平滑、训练秒级收敛、适合母带设备与温和染色</text>
  <text x="88" y="730" font-size="13.5" font-weight="bold" fill="#DC2626">✗ 固有局限：无法单独表征百毫秒慢压缩包络、多值磁滞与极端高增益多级级联硬削波</text>
  <rect x="88" y="750" width="656" height="96" rx="8" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="106" y="776" font-size="13" font-weight="bold" fill="#92400E">典型工程应用定位：</text>
  <text x="106" y="800" font-size="12.5" fill="#334155">• 模拟调音台总线、母带均衡器/激励器、电子管温和驱动、扬声器线性化预失真 (Pre-distortion)</text>
  <text x="106" y="824" font-size="12.5" fill="#334155">• 在混合建模平台中担任「可解释主干 (Backbone)」或「实时学生部署架构 (Student)」</text>

  
  <rect x="836" y="210" width="696" height="154" rx="10" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="856" y="236" font-size="15" font-weight="bold" fill="#5B21B6">1. 数据与特征构造：端到端自动表征学习 f_θ(x)</text>
  <text x="856" y="262" font-size="12.5" fill="#334155">• 由多层扩张卷积 (WaveNet) 或循环单元 (LSTM) 自动提取特征</text>
  <text x="856" y="288" font-size="12.5" fill="#334155">• 非线性激活函数逐层复合，隐式表征高阶交叉与动态门控</text>
  <text x="856" y="314" font-size="12.5" fill="#334155">• 样本需求较大：通常需 3～5 分钟涵盖全动态范围的激励音频</text>
  <rect x="1288" y="224" width="224" height="122" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="1400" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#5B21B6">深度层间复合映射</text>
  <text x="1400" y="274" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#334155">z^(l) = σ(W_f*z^(l-1)) ⊙</text>
  <text x="1400" y="296" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#7C3AED">        tanh(W_g*z^(l-1))</text>
  <text x="1400" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#991B1B">参数深层耦合，非凸优化</text>

  
  <rect x="836" y="378" width="696" height="176" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="856" y="404" font-size="13.5" font-weight="bold" fill="#991B1B">2. 离线训练求解：非凸损失地形与随机梯度迭代 (Adam / TBPTT)</text>
  <text x="856" y="430" font-size="12.5" fill="#334155">• 复合损失：ESR + MR-STFT（非凸地形，含鞍点与局部极值）</text>
  <text x="856" y="454" font-size="12.5" fill="#334155">• 训练算法：Mini-batch BP / TBPTT 与学习率退火迭代寻优</text>
  <text x="856" y="478" font-size="12.5" fill="#334155">• 训练耗时：GPU 上需迭代数万步，耗时 <tspan font-weight="bold" fill="#991B1B">数分钟～数小时</tspan></text>
  <text x="856" y="502" font-size="12.5" fill="#334155">• 稳定性控制：循环结构需配合 Washout 预热与谱半径约束</text>
  <text x="856" y="526" font-size="12" font-weight="bold" fill="#B91C1C">• 参数耦合性：权重分布于多层矩阵，难以直接解耦单项谐波</text>
  
  <rect x="1288" y="392" width="224" height="148" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="1400" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#991B1B">非凸多极值损失曲面 L(θ)</text>
  <path d="M 1304 436 Q 1326 502 1348 464 Q 1370 426 1392 512 Q 1414 436 1440 484 Q 1466 520 1496 434" fill="none" stroke="#7C3AED" stroke-width="2.8"/>
  <circle cx="1337" cy="476" r="4.5" fill="#D97706"/>
  <circle cx="1392" cy="496" r="6" fill="#059669"/>
  <circle cx="1456" cy="492" r="4.5" fill="#D97706"/>
  <text x="1392" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">SGD 寻优轨迹与局部极值</text>

  
  <rect x="836" y="568" width="696" height="294" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="856" y="594" font-size="15" font-weight="bold" fill="#0F172A">3. 实时音频推理 (processBlock) 与算力瓶颈</text>
  <rect x="856" y="610" width="656" height="64" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="874" y="634" font-size="12.0" font-weight="bold" fill="#5B21B6">数据流：x[n] → [Layer 1 扩张卷积/门控] → … → [Layer L] → Head 1×1（或 LSTM 逐样本串行更新 h[n]）</text>
  <text x="874" y="658" font-size="12.5" fill="#475569">计算特征：LSTM 存在样本间时间递归依赖 h[n]=f(h[n-1])，难以跨时间步向量化并行</text>
  <text x="856" y="702" font-size="12.2" font-weight="bold" fill="#059669">✓ 核心优势：对高增益电子管吉他箱头 (5150 / Dual Rectifier)、踏板强削波与复杂压缩门控具备极高拟合上限</text>
  <text x="856" y="730" font-size="13.5" font-weight="bold" fill="#DC2626">✗ 固有局限：高频非线性激活函数每层均产生内生混叠；训练区间外推易出现非物理折叠失真</text>
  <rect x="856" y="750" width="656" height="96" rx="8" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="874" y="776" font-size="13" font-weight="bold" fill="#5B21B6">典型工程应用定位：</text>
  <text x="874" y="800" font-size="12.5" fill="#334155">• 高增益吉他/贝斯放大器快照克隆 (NAM / Proteus / AIDA-X)、复杂单块效果器完整黑盒复刻</text>
  <text x="874" y="824" font-size="12.5" fill="#334155">• 在混合建模平台中担任「离线高容量教师模型 (Offline Teacher)」或「16 维轻量残差修补支路」</text>


  
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="15.5" font-weight="bold" fill="#F8FAFC">核心结论：Volterra 胜在「参数线性凸求解、物理可解释与极低实时算力」，NAM 胜在「强非光滑削波与深层级联表征」；二者通过残差协同与离线蒸馏实现优势互补。</text>
</svg>
