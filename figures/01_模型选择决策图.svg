<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="vBlur"/>
      <feOffset in="vBlur" dx="0" dy="3" result="vOffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="980" fill="#F8FAFC"/>

  <!-- Top Header Card -->
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="190" height="28" rx="6" fill="#0F172A"/>
  <text x="163.0" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 01-14 · 架构选型决策</text>
  <text x="274" y="70" font-size="27" font-weight="bold" fill="#0F172A">非线性音频系统建模架构选型决策树与算力谱系图</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">左侧通过四步残差诊断测试定位系统的记忆尺度与状态属性，右侧给出六级实时建模架构的参数量与适用场景</text>


  <!-- Left Panel: Sequential Residual Diagnostic Tree -->
    <rect x="48" y="144" width="736" height="738" rx="14" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="144" width="736" height="54" rx="14" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.5"/>
  <rect x="48" y="186" width="736" height="12" fill="#E0F2FE"/>
  <line x1="48" y1="198" x2="784" y2="198" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="68" y="168" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="68" y="188" font-size="12.5" fill="{dark}">{subtitle}</text>

  <!-- Step 1 Node -->
  <rect x="72" y="212" width="688" height="142" rx="12" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1.5"/>
  <rect x="88" y="226" width="118" height="26" rx="6" fill="#0284C7"/>
  <text x="147" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">诊断测试 Step 1</text>
  <text x="220" y="244" font-size="15.5" font-weight="bold" fill="#075985">不同输入电平 (-24 dB vs 0 dB) 下频响与相频是否恒定且无谐波？</text>
  <text x="88" y="274" font-size="13.5" fill="#334155">• 判据：相干函数 γ²(f) &gt; 0.999，THD &lt; -90 dB → <tspan font-weight="bold" fill="#059669">【是】选用 LTI FIR / IIR 线性滤波器</tspan></text>
  <text x="88" y="300" font-size="13.5" fill="#334155">• 若出现谐波簇 (2f₀, 3f₀)，进一步扫频检测各阶谐波包络是否随基频 f₀ 改变？</text>
  <text x="88" y="326" font-size="13.5" font-weight="bold" fill="#D97706">• 【谐波比恒定】→ 选无记忆多项式 / SNLM (Legendre 基 + ADAA)；【随频率变化】→ 进入 Step 2</text>

  <line x1="416" y1="354" x2="416" y2="374" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Step 2 Node -->
  <rect x="72" y="378" width="688" height="142" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="88" y="392" width="118" height="26" rx="6" fill="#D97706"/>
  <text x="147" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">诊断测试 Step 2</text>
  <text x="220" y="410" font-size="15.5" font-weight="bold" fill="#92400E">拟合广义 Hammerstein (对角核) 后，双音互调 (f₁±f₂) 残差是否显著？</text>
  <text x="88" y="440" font-size="13.5" fill="#334155">• 判据：ESS 对角核可完全复现单音谐波，且双音差频 f₂-f₁ 误差 &lt; -50 dB → <tspan font-weight="bold" fill="#059669">【否】选用对角 Volterra</tspan></text>
  <text x="88" y="466" font-size="13.5" fill="#334155">• 细分结构：若非线性夹在输入/输出定常 EQ 之间，可进一步约简为 Wiener–Hammerstein (L-N-L) 级联</text>
  <text x="88" y="492" font-size="13.5" font-weight="bold" fill="#7C3AED">• 【双音互调残差大 / 存在跨时刻交叉耦合】→ 必须引入非对角交叉核，进入 Step 3</text>

  <line x1="416" y1="520" x2="416" y2="540" stroke="#D97706" stroke-width="2.5" marker-end="url(#arr-amber)"/>

  <!-- Step 3 Node -->
  <rect x="72" y="544" width="688" height="142" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="88" y="558" width="118" height="26" rx="6" fill="#7C3AED"/>
  <text x="147" y="576" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">诊断测试 Step 3</text>
  <text x="220" y="576" font-size="15.5" font-weight="bold" fill="#5B21B6">非线性交叉记忆的持续时长 τ_mem 是否在短时间窗 (≤ 10 ms) 内？</text>
  <text x="88" y="606" font-size="13.5" fill="#334155">• 【τ_mem ≤ 2 ms (M ≤ 64)】：直接选用 <tspan font-weight="bold" fill="#5B21B6">带状剪枝 Volterra (|k₁-k₂| ≤ D, D = 4～12)</tspan></text>
  <text x="88" y="632" font-size="13.5" fill="#334155">• 【2 ms &lt; τ_mem ≤ 15 ms】：直接采样抽头导致参数爆炸，改用 <tspan font-weight="bold" fill="#059669">Laguerre 正交基 Volterra (V2-L, K=6～10)</tspan></text>
  <text x="88" y="658" font-size="13.5" font-weight="bold" fill="#DC2626">• 【τ_mem &gt; 20 ms 或存在断崖硬削波 / 剩磁回环】→ 超出纯泛函级数边界，进入 Step 4</text>

  <line x1="416" y1="686" x2="416" y2="706" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- Step 4 Node -->
  <rect x="72" y="710" width="688" height="150" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="88" y="724" width="118" height="26" rx="6" fill="#DC2626"/>
  <text x="147" y="742" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">诊断测试 Step 4</text>
  <text x="220" y="742" font-size="15.5" font-weight="bold" fill="#991B1B">长时动态与奇异非线性的物理机制归属哪一类？</text>
  <text x="88" y="772" font-size="13.5" fill="#334155">• 【慢增益压缩 / 偏置漂移】→ 选用 <tspan font-weight="bold" fill="#065F46">非对称递归包络 s_env[n] + 双线性状态空间 (Bilinear SSM) / 4A-2A</tspan></text>
  <text x="88" y="798" font-size="13.5" fill="#334155">• 【变压器铁芯 / 磁带多分支磁滞】→ 选用 <tspan font-weight="bold" fill="#7C3AED">Play / 速率相关 RD-Play 磁滞算子簇 (N_h=4～8)</tspan></text>
  <text x="88" y="824" font-size="13.5" fill="#334155">• 【高增益多级级联 / 复杂黑盒音箱】→ 选用 <tspan font-weight="bold" fill="#991B1B">白盒主干 + 小型 WaveNet/LSTM 残差混合架构</tspan></text>

  <!-- Right Panel: Model Family Matrix (Complexity vs Expressive Power) -->
    <rect x="816" y="144" width="736" height="738" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="816" y="144" width="736" height="54" rx="14" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="816" y="186" width="736" height="12" fill="#D1FAE5"/>
  <line x1="816" y1="198" x2="1552" y2="198" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="836" y="168" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="836" y="188" font-size="12.5" fill="{dark}">{subtitle}</text>

  <!-- Table / Cards inside Right Panel -->
  <!-- Tier A -->
  <rect x="836" y="212" width="696" height="86" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <rect x="850" y="226" width="170" height="58" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="935" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985">① LTI + SNLM 静态波表</text>
  <text x="935" y="272" text-anchor="middle" font-size="12" fill="#0369A1">Legendre 基 + ADAA1</text>
  <text x="1038" y="242" font-size="13" fill="#334155">• <tspan font-weight="bold">参数量</tspan>：M + P (≈ 70)   |   <tspan font-weight="bold">实时算力</tspan>：~80 MACs/sample (极低)</text>
  <text x="1038" y="266" font-size="13" fill="#334155">• <tspan font-weight="bold">典型任务</tspan>：数字软削波器、无记忆过载激励器、低 CPU 通道条染色</text>

  <!-- Tier B -->
  <rect x="836" y="310" width="696" height="86" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <rect x="850" y="324" width="170" height="58" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="935" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400E">② 广义 Hammerstein</text>
  <text x="935" y="370" text-anchor="middle" font-size="12" fill="#B45309">对角 Volterra (ESS 核)</text>
  <text x="1038" y="340" font-size="13" fill="#334155">• <tspan font-weight="bold">参数量</tspan>：P × M (≈ 256～1024)   |   <tspan font-weight="bold">实时算力</tspan>：P 次并行 FFT 卷积</text>
  <text x="1038" y="364" font-size="13" fill="#334155">• <tspan font-weight="bold">典型任务</tspan>：电子管前级、模拟台子通道频变谐波染色、Acustica 动态卷积</text>

  <!-- Tier C -->
  <rect x="836" y="408" width="696" height="86" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <rect x="850" y="422" width="170" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="935" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#5B21B6">③ 带状剪枝 Volterra</text>
  <text x="935" y="468" text-anchor="middle" font-size="12" fill="#6D28D9">近对角带宽 D = 4～12</text>
  <text x="1038" y="438" font-size="13" fill="#334155">• <tspan font-weight="bold">参数量</tspan>：M·(D+1) (≈ 500～1500)   |   <tspan font-weight="bold">实时算力</tspan>：D 条移位乘积支路滤波</text>
  <text x="1038" y="462" font-size="13" fill="#334155">• <tspan font-weight="bold">典型任务</tspan>：推挽级短时交叉记忆、微型扬声器非线性互调失真补偿</text>

  <!-- Tier D -->
  <rect x="836" y="506" width="696" height="86" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <rect x="850" y="520" width="170" height="58" rx="8" fill="#D1FAE5" stroke="#059669"/>
  <text x="935" y="544" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">④ Laguerre-Volterra</text>
  <text x="935" y="566" text-anchor="middle" font-size="12" fill="#047857">全通正交基 K = 6～10</text>
  <text x="1038" y="536" font-size="13" fill="#334155">• <tspan font-weight="bold">参数量</tspan>：K(K+1)/2 (≈ 36～55)   |   <tspan font-weight="bold">实时算力</tspan>：K 阶全通递推 + 小型二次型</text>
  <text x="1038" y="560" font-size="13" fill="#334155">• <tspan font-weight="bold">典型任务</tspan>：中长衰减记忆交叉核、温和变压器频变饱和、高条件数辨识</text>

  <!-- Tier E -->
  <rect x="836" y="604" width="696" height="114" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="850" y="618" width="170" height="86" rx="8" fill="#059669"/>
  <text x="935" y="648" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">⑤ 灰盒状态组合主干 ★</text>
  <text x="935" y="670" text-anchor="middle" font-size="12" fill="#D1FAE5">V2-L + Play 磁滞</text>
  <text x="935" y="690" text-anchor="middle" font-size="12" fill="#D1FAE5">+ Bilinear SSM 包络</text>
  <text x="1038" y="634" font-size="13" font-weight="bold" fill="#065F46">• 现代母带插件主力架构（参数量 ≈ 120～300，CPU 占用 &lt; 3%）</text>
  <text x="1038" y="658" font-size="13" fill="#334155">• 兼顾短时泛函记忆 (V2-L)、多值剩磁回环 (RD-Play) 与慢包络交叉调制</text>
  <text x="1038" y="682" font-size="13" fill="#334155">• 旋钮参数具备明确物理意义，零延迟或仅 0.5 采样 ADAA 相位补偿</text>

  <!-- Tier F -->
  <rect x="836" y="730" width="696" height="130" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <rect x="850" y="744" width="170" height="102" rx="8" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="935" y="776" text-anchor="middle" font-size="14" font-weight="bold" fill="#991B1B">⑥ 白盒主干 + 神经残差</text>
  <text x="935" y="798" text-anchor="middle" font-size="12" fill="#B91C1C">或全黑盒 NAM</text>
  <text x="935" y="818" text-anchor="middle" font-size="12" fill="#991B1B">(WaveNet / LSTM)</text>
  <text x="1038" y="762" font-size="13" fill="#334155">• <tspan font-weight="bold">混合残差型</tspan>：灰盒主干解释 90% 能量 + 16 维轻量 GRU 拟合尾端高阶残差</text>
  <text x="1038" y="788" font-size="13" fill="#334155">• <tspan font-weight="bold">全黑盒 NAM</tspan>：适合高增益吉箱头 (5150/Rectifier) 极端多级削波，参数量 10³～10⁴</text>
  <text x="1038" y="814" font-size="13" font-weight="bold" fill="#991B1B">• 蒸馏闭环：离线采用高维教师模型拟合，再蒸馏至 ⑤ 号实时学生结构部署</text>


  <!-- Bottom Dark Summary Bar -->
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="15.5" font-weight="bold" fill="#F8FAFC">核心结论：工程建模应遵循「先线性、再对角、后正交基交叉、慢状态与磁滞剥离、神经仅补残差」的分治准则，避免盲目堆叠高阶张量或重型黑盒。</text>
</svg>
