    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#F8FAFC"/>

  
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="248" height="28" rx="6" fill="#0F172A"/>
  <text x="192.2" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 05-01 · 白盒电路与无源离散化</text>
  <text x="332" y="70" font-size="27" font-weight="bold" fill="#0F172A">DK 离散状态空间法、波数字滤波器 (WDF) 与端口哈密顿离散梯度无源架构图</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">对比现代电路/声学仿真的三大核心范式，并揭示「端口哈密顿离散梯度守恒格式」与「一阶 ADAA 抗混叠」的严格数学同构</text>


  
    <rect x="48" y="144" width="480" height="738" rx="14" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="144" width="480" height="54" rx="14" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.5"/>
  <rect x="48" y="186" width="480" height="12" fill="#E0F2FE"/>
  <line x1="48" y1="198" x2="528" y2="198" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="68" y="168" font-size="17" font-weight="bold" fill="#075985">方法 I：离散基尔霍夫状态空间法 (Yeh DK-Method)</text>
  <text x="68" y="188" font-size="12.5" fill="#075985">分离 d 维线性状态递推与 N_nl 维非线性端口求根 / 预计算 LUT</text>
    <rect x="560" y="144" width="480" height="738" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="560" y="144" width="480" height="54" rx="14" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="560" y="186" width="480" height="12" fill="#FEF3C7"/>
  <line x1="560" y1="198" x2="1040" y2="198" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="580" y="168" font-size="17" font-weight="bold" fill="#78350F">方法 II：波数字滤波器 (WDF, Fettweis 散射域)</text>
  <text x="580" y="188" font-size="12.5" fill="#78350F">通过选择无反射端口阻抗 R₀ 彻底消除拓扑延迟自由环</text>
    <rect x="1072" y="144" width="480" height="738" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1072" y="144" width="480" height="54" rx="14" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="1072" y="186" width="480" height="12" fill="#D1FAE5"/>
  <line x1="1072" y1="198" x2="1552" y2="198" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="1092" y="168" font-size="17" font-weight="bold" fill="#065F46">方法 III：端口哈密顿 (pHS) 与离散梯度法</text>
  <text x="1092" y="188" font-size="12.5" fill="#065F46">无条件保证离散能量单调耗散 ΔH ≤ 0 · 与 ADAA₁ 严格数学同构</text>

  
  <rect x="68" y="210" width="440" height="296" rx="10" fill="#F0F9FF" stroke="#7DD3FC"/>
  <text x="86" y="236" font-size="14" font-weight="bold" fill="#075985">1. 梯形法则离散化与线性-非线性端口解耦 (Yeh et al. 2010)：</text>
  <text x="86" y="260" font-size="12.5" fill="#334155">将电容/电感梯形伴随模型代入节点分析 (MNA)，消去内部线性节点：</text>

  
  <rect x="86" y="274" width="404" height="154" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="102" y="290" width="372" height="44" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="288" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">① 显式线性自由响应预测：p[n] = D·s[n-1] + E·u[n]</text>
  <text x="288" y="326" text-anchor="middle" font-size="11" fill="#0369A1">(仅依赖上一拍储能状态 s[n-1] 与当前输入 u[n]，纯矩阵乘)</text>

  <line x1="288" y1="334" x2="288" y2="352" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="102" y="354" width="372" height="62" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="288" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">② 极低维非线性端口方程 (维数 N_nl = 1～2 ≪ N_node)：</text>
  <text x="288" y="394" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#78350F">F(v_nl) = v_nl - K · i_nl(v_nl) - p[n] = 0</text>
  <text x="288" y="410" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">离线预解映射 i_nl = Ψ_LUT(p[n])，实时 O(1) 查表求值</text>

  <text x="86" y="452" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#0F172A">③ 状态与输出更新：s[n] = A·s[n-1] + B·u[n] + C·i_nl</text>
  <text x="86" y="474" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#0F172A">                  y[n] = F_o·s[n-1] + G_o·u[n] + H_o·i_nl</text>
  <text x="86" y="496" font-size="10.5" font-weight="bold" fill="#0369A1">• 维度压缩特性：非线性求根维度仅取决于非线性端口数 N_nl，与线性元件总数无关</text>

  <rect x="68" y="520" width="440" height="342" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="86" y="546" font-size="14" font-weight="bold" fill="#0F172A">2. 1D/2D 预计算三次样条查找表 (LUT) 与阻尼牛顿保底：</text>
  <text x="86" y="572" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#059669">离线烘焙 (Offline Baking)</tspan>：由于矩阵 K 由固定无源网络决定，</text>
  <text x="100" y="592" font-size="12.5" fill="#334155">单变量或双变量隐式映射 p ↦ i_nl(p) 在编译期即可用高精度牛顿法</text>
  <text x="100" y="612" font-size="11.2" fill="#334155">离线求根，存储为非均匀网格（原点加密、渐近区稀疏）的 Hermite 样条表；</text>
  <text x="86" y="638" font-size="12.5" fill="#334155">• <tspan font-weight="bold">实时开销</tspan>：单端口预计算为 1D 查找表后，仅需样条插值与状态更新</text>
  <text x="86" y="664" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#92400E">时变旋钮处理</tspan>：若电位器旋钮改变了矩阵 K(c_knob)，采用低秩矩阵</text>
  <text x="100" y="684" font-size="11.1" fill="#334155">Sherman–Morrison 公式更新，或以上一拍解为初值执行固定 2 步阻尼牛顿：</text>
  <rect x="86" y="698" width="404" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="288" y="725" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#0F172A">v^(k+1) = v^(k) - α_damp · ( I - K · J_i(v^(k)) )⁻¹ · F(v^(k))</text>
  <text x="86" y="768" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#991B1B">梯形法则振铃抑制</tspan>：双线性变换在 Nyquist 处 s = j∞ 引发极性翻转</text>
  <text x="100" y="790" font-size="12.5" fill="#334155">振荡；强开关瞬态处可掺入 α_BDF ∈ [0, 0.15] 的 BDF2 阻尼项</text>
  <text x="86" y="818" font-size="12.5" font-weight="bold" fill="#075985">• 商业代表：Universal Audio / Softube / Arturia 经典踏板与均衡器仿真</text>

  
  <rect x="580" y="210" width="440" height="310" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="598" y="236" font-size="14" font-weight="bold" fill="#92400E">1. Kirchhoff (v, i) 域 → Fettweis 波变量 (a, b) 散射变换：</text>
  <rect x="598" y="250" width="404" height="62" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="800" y="274" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#78350F">入射波 a = v + R₀ · i,     反射波 b = v - R₀ · i</text>
  <text x="800" y="298" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#92400E">逆变换：v = (a + b) / 2,    i = (a - b) / (2 R₀)</text>

  
  <rect x="598" y="324" width="404" height="182" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="800" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400E">WDF 模块化散射连接树与顶部无反射端口 (Reflection-Free Port)</text>

  
  <rect x="716" y="356" width="168" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="800" y="381" text-anchor="middle" font-size="10.9" font-weight="bold" fill="#5B21B6">根节点非线性：b_nl = f(a_nl)</text>

  
  <line x1="770" y1="422" x2="770" y2="400" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-green)"/>
  <text x="730" y="416" font-size="10.5" font-weight="bold" fill="#065F46">↑ a_nl (无反射)</text>
  <line x1="830" y1="398" x2="830" y2="420" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arr-purple)"/>
  <text x="870" y="416" font-size="10.5" font-weight="bold" fill="#5B21B6">b_nl ↓</text>

  
  <rect x="690" y="424" width="220" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="800" y="447" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">串/并联散射适配器 S (S₃₃ = 0)</text>

  
  <rect x="614" y="472" width="156" height="28" rx="5" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="692" y="490" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#075985">电容 R₀=T_s/2C, b[n]=a[n-1]</text>
  <rect x="830" y="472" width="156" height="28" rx="5" fill="#D1FAE5" stroke="#059669"/>
  <text x="908" y="490" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#065F46">电感 R₀=2L/T_s, b[n]=-a[n-1]</text>

  <rect x="580" y="534" width="440" height="328" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="598" y="560" font-size="14" font-weight="bold" fill="#0F172A">2. 自由参数 R₀ 消除延迟自由环与 WDF 的拓扑边界：</text>
  <text x="598" y="586" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#059669">为什么没有隐式循环？</tspan>：对于线性电容，取端口电阻 R₀ = T_s/(2C)，</text>
  <text x="612" y="606" font-size="12.5" fill="#334155">梯形积分恰好化简为纯一拍寄存器延迟 b[n] = a[n-1]，当前入射波 a[n]</text>
  <text x="612" y="626" font-size="12.5" fill="#334155">对当前反射波 b[n] 的瞬时直通系数恒等于 0</text>
  <text x="598" y="652" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#92400E">根节点匹配条件</tspan>：将唯一的非线性元件（如三极管或二极管对）放置在</text>
  <text x="612" y="672" font-size="12.1" fill="#334155">树根端口 3，令 R₃ 等于下部线性子树等效戴维南阻抗，从而使散射矩阵</text>
  <text x="612" y="692" font-size="12.5" font-weight="bold" fill="#B45309">对角元 S₃₃ = 0，使入射波 a₃[n] 独立于 b₃[n]，解除无延迟代数环</text>
  <text x="598" y="720" font-size="12.5" fill="#334155">• <tspan font-weight="bold">增量无源性定理</tspan>：无源元件反射增益 |b| ≤ |a|，即使在 16-bit 定点</text>
  <text x="612" y="740" font-size="12.5" fill="#334155">量化截断下亦可有效抑制极限环振荡 (Limit Cycles)</text>
  <text x="598" y="768" font-size="12.5" font-weight="bold" fill="#991B1B">• 局限与现代扩展 (R-Type Adaptor)：</text>
  <text x="612" y="790" font-size="12" fill="#334155">标准二叉树仅允许顶部有 1 个非线性根端口；当电路含桥式拓扑或</text>
  <text x="612" y="810" font-size="11.0" fill="#334155">多个耦合三极管时，需在树顶引入 R 型多端口散射矩阵结合小型 LUT 求解。</text>

  
  <rect x="1092" y="210" width="440" height="310" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="1110" y="236" font-size="14" font-weight="bold" fill="#065F46">1. 端口哈密顿系统 (Port-Hamiltonian, pHS) 能量平衡定律：</text>
  <text x="1110" y="260" font-size="12.5" fill="#334155">将任何非线性机电/声学/电路网络分解为储能哈密顿量 H(s)、反对称</text>
  <text x="1110" y="280" font-size="12.5" fill="#334155">陀螺互联矩阵 J = -Jᵀ 与半正定电阻耗散矩阵 R = Rᵀ ≥ 0：</text>

  <rect x="1110" y="294" width="404" height="86" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="1312" y="318" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#065F46">ds/dt = [ J(s) - R(s) ] · ∇H(s) + G(s) · u(t)</text>
  <text x="1312" y="342" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#0F172A">y(t)  = G(s)ᵀ · ∇H(s)       (共轭功率端口 uᵀy)</text>
  <text x="1312" y="366" text-anchor="middle" font-size="11.3" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#DC2626">dH/dt = uᵀy - (∇H)ᵀ R (∇H) ≤ uᵀy   (因反对称矩阵满足 vᵀJv ≡ 0)</text>

  <text x="1110" y="404" font-size="12.5" fill="#334155">• <tspan font-weight="bold">物理铁律</tspan>：只要保持 J 反对称且 R ≥ 0，无论储能函数 H(s) 的非线性</text>
  <text x="1124" y="424" font-size="12.0" fill="#334155">多么剧烈（如铁芯磁饱和或扬声器大振幅刚度硬化），系统内部绝不凭空</text>
  <text x="1124" y="444" font-size="12.5" font-weight="bold" fill="#065F46">产生虚假能量，从而在理论上保证无源稳定</text>
  <text x="1110" y="472" font-size="11.1" fill="#334155">• <tspan font-weight="bold">离散化危机</tspan>：普通显式欧拉或 RK4 会破坏连续域链式法则 dH/dt = ∇H·ds/dt，</text>
  <text x="1124" y="492" font-size="12.5" fill="#991B1B">破坏离散链式法则，在大信号高频驱动下易引发数值发散</text>

  
  <rect x="1092" y="534" width="440" height="328" rx="10" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="1110" y="560" font-size="13.2" font-weight="bold" fill="#5B21B6">2. 离散梯度法 (Discrete Gradient) 与 ADAA₁ 的惊人数学同构：</text>
  <text x="1110" y="586" font-size="11.5" fill="#334155">• 构造离散梯度算子 ∇_d H(s_n, s_{n-1})，使其满足割线恒等式：</text>

  <rect x="1110" y="600" width="404" height="92" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="1312" y="624" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#5B21B6">∇_d H(s_n, s_{n-1})ᵀ · ( s_n - s_{n-1} )  ≡  H(s_n) - H(s_{n-1})</text>
  <text x="1312" y="652" text-anchor="middle" font-size="12.6" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#059669">1D 标量情形：∇_d H = ( H(s_n) - H(s_{n-1}) ) / ( s_n - s_{n-1} )</text>
  <text x="1312" y="676" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#DC2626">该一维割线离散梯度与一阶反导数抗混叠 (ADAA₁) 具有相同的差商代数形式</text>

  <text x="1110" y="718" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#065F46">双重物理收益（一石二鸟定理）</tspan>：</text>
  <text x="1124" y="742" font-size="11.9" fill="#334155">① <tspan font-weight="bold">信号处理视角</tspan>：割线差分等效于分片线性重构下的连续域反导数积分，</text>
  <text x="1138" y="762" font-size="12.5" fill="#334155">赋予非线性恢复力 f(s) = H'(s) 二阶 sinc² 低通抗混叠滤波；</text>
  <text x="1124" y="786" font-size="11.2" fill="#334155">② <tspan font-weight="bold">物理力学视角</tspan>：单步能量差 ΔH = H(s_n) - H(s_{n-1}) 精确等于端口输入</text>
  <text x="1138" y="806" font-size="10.5" fill="#334155">功减去耗散项 -T_s·(∇_d H)ᵀ R (∇_d H) ≤ 0，在离散时间下保持无源能量不等式</text>
  <text x="1110" y="836" font-size="10.5" font-weight="bold" fill="#5B21B6">• 神经扩展 (pH-Neural Net)：直接参数化凸网络 H_θ(s) 与 Cholesky 矩阵 L_R L_Rᵀ</text>


  
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="15.5" font-weight="bold" fill="#F8FAFC">核心结论：DK 法将非线性求根压缩至极小端口维并编译为 LUT；WDF 用无反射端口消除延迟环；离散梯度法在抑制混叠的同时无条件保证离散能量单调耗散。</text>
</svg>
