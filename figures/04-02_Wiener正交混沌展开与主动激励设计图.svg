  <rect width="1600" height="980" fill="#F8FAFC"/>

  
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="234" height="28" rx="6" fill="#0F172A"/>
  <text x="184.9" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 04-02 · 混沌展开与最优激励</text>
  <text x="318" y="70" font-size="27" font-weight="bold" fill="#0F172A">分数阶 Oustaloup 极零交错、Wiener 正交混沌展开 (PCE) 与 D-最优主动激励设计图</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">涵盖幂律长尾记忆有理化、高斯白噪声 Gram–Schmidt 正交解耦、硬件元件公差传播及 Fisher 信息椭球最小化</text>


  
    <rect x="48" y="144" width="480" height="738" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="144" width="480" height="54" rx="14" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="48" y="186" width="480" height="12" fill="#FEF3C7"/>
  <line x1="48" y1="198" x2="528" y2="198" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="68" y="168" font-size="17" font-weight="bold" fill="#78350F">模块 I：分数阶幂律记忆与 Oustaloup 极零交错</text>
  <text x="68" y="188" font-size="12.5" fill="#78350F">在给定频带内以交错极零点逼近分数阶频率响应</text>
    <rect x="560" y="144" width="480" height="738" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="560" y="144" width="480" height="54" rx="14" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="560" y="186" width="480" height="12" fill="#EDE9FE"/>
  <line x1="560" y1="198" x2="1040" y2="198" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="580" y="168" font-size="17" font-weight="bold" fill="#5B21B6">模块 II：Wiener 正交 G-泛函与多项式混沌 (PCE)</text>
  <text x="580" y="188" font-size="12.5" fill="#5B21B6">高斯白噪声正交解耦、Lee–Schetzen 互相关与元件公差传播</text>
    <rect x="1072" y="144" width="480" height="738" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1072" y="144" width="480" height="54" rx="14" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="1072" y="186" width="480" height="12" fill="#D1FAE5"/>
  <line x1="1072" y1="198" x2="1552" y2="198" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="1092" y="168" font-size="17" font-weight="bold" fill="#065F46">模块 III：Fisher 信息矩阵与 D-最优主动激励</text>
  <text x="1092" y="188" font-size="12.5" fill="#065F46">比较激励带来的参数不确定性，再用独立记录检验预测</text>

  
  <rect x="68" y="210" width="440" height="310" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="86" y="236" font-size="13.0" font-weight="bold" fill="#92400E">1. 为什么真实模拟硬件常表现为幂律衰减 t^(-α) 而非纯指数衰减？</text>
  <text x="86" y="262" font-size="12.5" fill="#334155">• 对具有慢恢复尾部的器件，可检验如下分数阶弛豫模型：</text>
  <rect x="86" y="276" width="404" height="46" rx="6" fill="#FFFFFF" stroke="#D97706"/>
  <text x="288" y="304" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#78350F">Dᵅz(t) + λz(t) = g(x(t)),   0 &lt; α &lt; 1</text>

  
  <rect x="86" y="334" width="404" height="172" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="288" y="354" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400E">双对数坐标下：幂律长尾 t^(-α) vs 单一指数极点 e^(-t/τ) 截断</text>
  <line x1="114" y1="478" x2="466" y2="478" stroke="#64748B" stroke-width="1.2"/>
  <line x1="114" y1="366" x2="114" y2="478" stroke="#64748B" stroke-width="1.2"/>
  
  <line x1="124" y1="376" x2="454" y2="464" stroke="#D97706" stroke-width="3"/>
  
  <path d="M 124 376 Q 230 390 280 476 L 454 477" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4 2"/>
  <text x="370" y="428" font-size="11" font-weight="bold" fill="#B45309">幂律尾部示意</text>
  <text x="230" y="468" font-size="11" font-weight="bold" fill="#DC2626">单指数尾部衰减更快</text>
  <text x="288" y="496" text-anchor="middle" font-size="10.5" fill="#475569">log₁₀(t) 跨越 0.1 ms ～ 1000 ms (4 个十倍频程)</text>

  
  <rect x="68" y="534" width="440" height="328" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="86" y="560" font-size="12.6" font-weight="bold" fill="#0F172A">2. Oustaloup 极零点交错近似（在指定频带内比较幅度与相位）</text>
  <text x="86" y="586" font-size="12.5" fill="#334155">• 直接截断幂律尾部可能需要很多抽头。另一种做法是在负实轴上</text>
  <text x="86" y="606" font-size="12.5" fill="#334155">  交替放置有限对极点和零点，阶数由目标频带和误差决定。</text>

  
  <rect x="86" y="620" width="404" height="96" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="288" y="640" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">s 平面负实轴极点 (✕) 与零点 (○) 对数等比交错排列</text>
  <line x1="106" y1="676" x2="470" y2="676" stroke="#475569" stroke-width="1.5"/>
  <line x1="454" y1="652" x2="454" y2="700" stroke="#475569" stroke-width="1.5"/>
  
  <text x="424" y="681" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">✕</text>
  <circle cx="394" cy="676" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="360" y="681" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">✕</text>
  <circle cx="324" cy="676" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="284" y="681" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">✕</text>
  <circle cx="242" cy="676" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="196" y="681" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">✕</text>
  <circle cx="148" cy="676" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="288" y="704" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">示意微分算子 s^α：理想幅度随频率升高，相角为 +απ/2</text>

  <text x="86" y="742" font-size="12.5" fill="#334155">• 离散化后，可用级联一阶节或等价的部分分式并联实现。</text>
  <text x="86" y="768" font-size="12.5" fill="#334155">• 例如对光电压缩器的释放尾部，拟合单指数、多指数与幂律模型。</text>
  <text x="100" y="790" font-size="12.0" fill="#334155">  用未参与拟合的不同预激励、静音时长和探针复验。</text>
  <text x="86" y="818" font-size="12.5" font-weight="bold" fill="#B45309">• 记录目标频带内最大幅度误差（dB）、相位误差（度）与块耗时。</text>

  
  <rect x="580" y="210" width="440" height="330" rx="10" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="598" y="236" font-size="14" font-weight="bold" fill="#5B21B6">1. Wiener G-泛函正交化与 Lee–Schetzen 互相关辨识：</text>
  <text x="598" y="262" font-size="12.5" fill="#334155">• 原始 Volterra 项 H_p[x] 在高斯白噪声 w[n] ~ N(0, σ_x²) 下彼此非正交</text>
  <text x="598" y="282" font-size="12.5" fill="#334155">  （如 E[x²[n]] = σ_x² ≠ 0 污染常数项，x³[n] 污染线性项 3σ_x²x[n]）；</text>
  <text x="598" y="304" font-size="12.5" font-weight="bold" fill="#6D28D9">• Wiener 通过泛函 Gram–Schmidt 正交化构造互不相关的 G_p 泛函：</text>

  <rect x="598" y="318" width="404" height="104" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="614" y="342" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#0F172A">G₀ = k₀</text>
  <text x="614" y="362" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#0284C7">G₁[k₁; x] = ∑ k₁[m] x[n-m]</text>
  <text x="614" y="384" font-size="10.6" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#5B21B6">G₂[k₂; x] = ∑∑ k₂[m₁,m₂] x[n-m₁]x[n-m₂] - σ_x² ∑ k₂[m,m]</text>
  <text x="614" y="406" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#7C3AED">G₃[k₃; x] = H₃[k₃; x] - 3σ_x² ∑∑ k₃[m₁,m,m] x[n-m₁]</text>

  <text x="598" y="446" font-size="12.5" fill="#334155">• 不同阶 G-泛函正交。以二阶为例，用中心化的乘积计算互相关。</text>
  <text x="612" y="468" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#065F46">k₂(i,j) = E{y[n] · (x[n−i] x[n−j] − σ² δᵢⱼ)} / (2σ⁴)</text>
  <text x="598" y="492" font-size="11.4" fill="#334155">  这里 x 是零均值高斯白噪声，核按对称形式计数，σ² 为输入方差。</text>
  <text x="598" y="518" font-size="12" font-weight="bold" fill="#5B21B6">• 离散有限样本修正：实测有限长序列下建议结合 Cholesky/QR 再正交化</text>

  
  <rect x="580" y="554" width="440" height="308" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="598" y="580" font-size="13.1" font-weight="bold" fill="#065F46">2. 多项式混沌展开 (PCE) —— 模拟硬件元件公差与个体差异建模：</text>
  <text x="598" y="606" font-size="11.2" fill="#334155">• 示例：以均匀分布描述某项元件公差，先将偏差映射到 ξ ∈ [−1,1]。</text>
  <text x="598" y="628" font-size="12.5" fill="#334155">• 将随机参数 ξ 按 Wiener–Askey 正交多项式 Ψ_α(ξ) 展开 Volterra 核：</text>

  <rect x="598" y="642" width="404" height="52" rx="6" fill="#FFFFFF" stroke="#059669"/>
  <text x="800" y="666" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#065F46">h_p(k ; ξ) = ∑_{|α| ≤ Q}  h_p^(α)(k) · Ψ_α(ξ₁, …, ξ_d)</text>
  <text x="800" y="684" text-anchor="middle" font-size="10.6" fill="#047857">(高斯分布参数选 Hermite 多项式 He_α；均匀分布选 Legendre 多项式 P_α)</text>

  
  <rect x="598" y="704" width="404" height="96" rx="8" fill="#FFFFFF" stroke="#A7F3D0"/>
  <path d="M 618 764 Q 720 712 820 744 T 980 732" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M 618 784 Q 720 744 820 772 T 980 762" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M 618 774 Q 720 728 820 758 T 980 747" fill="none" stroke="#065F46" stroke-width="2.8"/>
  <text x="800" y="724" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#065F46">均值核与公差方差；若基已归一，方差等于非常数项系数平方和</text>
  <text x="800" y="792" text-anchor="middle" font-size="10.5" fill="#047857">相比蒙特卡洛随机采样，PCE 可解析给出输出均值与方差包络带</text>

  <text x="598" y="824" font-size="12.5" font-weight="bold" fill="#065F46">• 工程应用：在立体声通道间引入模拟器件公差微差 (Tolerance) 时，</text>
  <text x="612" y="844" font-size="11.6" fill="#334155">通过抽样低维随机坐标 ξ_i 即可合成符合电路公差统计分布的通道间微差</text>

  
  <rect x="1092" y="210" width="440" height="350" rx="10" fill="#F0F9FF" stroke="#7DD3FC"/>
  <text x="1110" y="236" font-size="12.3" font-weight="bold" fill="#075985">1. Cramér–Rao 下界与 D-最优主动激励设计 (Active Input Design)：</text>
  <text x="1110" y="262" font-size="12.5" fill="#334155">• 在独立同方差高斯噪声的线性回归中，若设计矩阵 Φ 满列秩，</text>
  <text x="1110" y="282" font-size="12.5" fill="#334155">  无偏估计的协方差具有下界，ℐ 为 Fisher 信息矩阵：</text>

  <rect x="1110" y="296" width="404" height="54" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="1312" y="320" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#075985">Cov(θ̂) ⪰ ℐ⁻¹ = σ² (ΦᵀΦ)⁻¹</text>
  <text x="1312" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#059669">D-最优设计：在允许的激励中最大化 ln det(ΦᵀΦ)</text>

  
  <rect x="1110" y="362" width="404" height="182" rx="8" fill="#FFFFFF" stroke="#BAE6FD"/>
  <text x="1312" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">参数空间 (θ₁, θ₂) 不确定性置信椭球体积 V ∝ det(ℐ)⁻¹/²</text>
  <line x1="1150" y1="464" x2="1474" y2="464" stroke="#94A3B8" stroke-width="1"/>
  <line x1="1312" y1="396" x2="1312" y2="532" stroke="#94A3B8" stroke-width="1"/>
  
  <g transform="translate(1312,464) rotate(-28)">
    <ellipse cx="0" cy="0" rx="135" ry="26" fill="#FEE2E2" fill-opacity="0.55" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 2"/>
  </g>
  
  <circle cx="1312" cy="464" r="24" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
  <circle cx="1312" cy="464" r="4" fill="#0F172A"/>
  <text x="1204" y="416" font-size="11" font-weight="bold" fill="#DC2626">示意：参数方向高度相关时椭圆狭长</text>
  <text x="1340" y="494" font-size="11" font-weight="bold" fill="#065F46">D-最优：面积较小</text>
  <text x="1312" y="536" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#0369A1">椭球体积衡量联合不确定性；其形状还取决于各参数的灵敏度。</text>

  
  <rect x="1092" y="574" width="440" height="288" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="1110" y="600" font-size="14" font-weight="bold" fill="#0F172A">2. 候选阶数的比较与频带诊断</text>
  <rect x="1110" y="614" width="404" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="1312" y="641" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#0F172A">BIC = −2 ln L(θ̂) + k ln N</text>

  <text x="1110" y="682" font-size="12.5" fill="#334155">• 在同一组 N 个独立观测上比较候选模型；L(θ̂) 为最大似然值，</text>
  <text x="1124" y="702" font-size="12.5" fill="#334155">  k 为拟合参数数目。经典 BIC 取较小值，另用留出录音核对。</text>
  <text x="1110" y="728" font-size="12.5" font-weight="bold" fill="#075985">• 测量输出 y 与预测 ŷ 的幅平方相干度（S 表示功率谱或互谱）：</text>
  <text x="1124" y="750" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#334155">γ²(f) = |S_yŷ(f)|² / [S_yy(f) S_ŷŷ(f)]</text>
  <text x="1110" y="776" font-size="12.5" fill="#334155">• 相干度降低时先检查对齐、噪声和激励覆盖，再比较分支消融</text>
  <text x="1124" y="798" font-size="12.5" fill="#334155">  前后的残差谱。不同支路可能相关，其贡献一般不能直接相加。</text>
  <text x="1124" y="820" font-size="12.5" font-weight="bold" fill="#991B1B">  记录使用的窗长和平均方法，并复核目标频段的绝对残差。</text>


  
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="15.5" font-weight="bold" fill="#F8FAFC">读图顺序：先限定幂律近似的频带，再辨认正交基针对哪种随机量，最后用测试激励改变参数不确定性，并在独立录音上检查预测。</text>
</svg>
