<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="vBlur"/>
      <feOffset in="vBlur" dx="0" dy="3" result="vOffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#F8FAFC"/>

  
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="219" height="28" rx="6" fill="#0F172A"/>
  <text x="177.6" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 03-04 · 四种协同运行模式</text>
  <text x="303" y="70" font-size="27" font-weight="bold" fill="#0F172A">白盒/灰盒物理模型与神经网络协同的四种运行模式及离线蒸馏架构图</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">严格对应第 03 章 §3.8 分类：并联残差补偿、控制率状态/参数调制、串联分块级联、白盒内嵌局部元件代理与离线蒸馏</text>


  

  
    <rect x="48" y="144" width="736" height="316" rx="14" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="144" width="736" height="54" rx="14" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.5"/>
  <rect x="48" y="186" width="736" height="12" fill="#E0F2FE"/>
  <line x1="48" y1="198" x2="784" y2="198" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="68" y="168" font-size="17" font-weight="bold" fill="#075985">模式 ① 并联残差补偿型 (Parallel Residual Architecture)</text>
  <text x="68" y="188" font-size="12.5" fill="#075985">白盒/灰盒主干承担 ≥90% 能量，轻量神经网络并联修补高阶残差</text>
  <rect x="68" y="210" width="696" height="134" rx="10" fill="#F0F9FF" stroke="#BAE6FD"/>
  
  <rect x="88" y="256" width="64" height="36" rx="6" fill="#0F172A"/><text x="120" y="279" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">x[n]</text>
  <line x1="152" y1="274" x2="196" y2="274" stroke="#0F172A" stroke-width="2"/>
  <line x1="196" y1="242" x2="196" y2="310" stroke="#0F172A" stroke-width="2"/>
  <line x1="196" y1="242" x2="236" y2="242" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="196" y1="310" x2="236" y2="310" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-purple)"/>

  <rect x="240" y="220" width="280" height="44" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="380" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">白盒主干 H_white(x) (LTI + V2-L + ADAA)</text>

  <rect x="240" y="286" width="280" height="44" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="380" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#5B21B6">轻量神经残差 α · f_NN(x; θ)  (|α| ≤ 0.15)</text>

  <line x1="520" y1="242" x2="596" y2="264" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="520" y1="310" x2="596" y2="284" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-purple)"/>
  <circle cx="612" cy="274" r="16" fill="#059669"/><text x="612" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">⊕</text>
  <line x1="628" y1="274" x2="668" y2="274" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="672" y="256" width="72" height="36" rx="6" fill="#059669"/><text x="708" y="279" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">ŷ[n]</text>

  <text x="68" y="370" font-size="13" fill="#334155">• <tspan font-weight="bold">数学方程</tspan>：ŷ[n] = H_white[x][n] + α · f_NN(x_{n:n-L}; θ_NN)，搭配正交性约束 Φᵀ y_NN ≈ 0</text>
  <text x="68" y="396" font-size="13" fill="#334155">• <tspan font-weight="bold">核心优势</tspan>：即使将 α 置零，系统仍是一个完整可用的高精度灰盒插件，鲁棒性最高</text>
  <text x="68" y="422" font-size="13" font-weight="bold" fill="#0369A1">• 适用场景：母带总线饱和器、模拟调音台通道建模、高保真变压器染色修补</text>
  <text x="68" y="446" font-size="12.5" fill="#475569">• 工程要点：两支路必须严格对齐群延迟（含 ADAA 的 0.5 采样延迟补偿），防止高频相消梳状滤波</text>

  
    <rect x="816" y="144" width="736" height="316" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="816" y="144" width="736" height="54" rx="14" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="816" y="186" width="736" height="12" fill="#D1FAE5"/>
  <line x1="816" y1="198" x2="1552" y2="198" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="836" y="168" font-size="17" font-weight="bold" fill="#065F46">模式 ② 状态耦合与超网络参数调制型 (State / Hyper-Param Modulation)</text>
  <text x="836" y="188" font-size="12.5" fill="#065F46">神经网络工作在慢控制率下，动态调制白盒 DSP 的包络、极点与核权重</text>
  <rect x="836" y="210" width="696" height="134" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  
  <rect x="856" y="232" width="64" height="36" rx="6" fill="#0F172A"/><text x="888" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">x[n]</text>
  <line x1="920" y1="250" x2="1020" y2="250" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <rect x="1024" y="222" width="360" height="56" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/>
  <text x="1204" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">音频率白盒 DSP 算子 H_DSP( x[n] ; θ[n] )</text>
  <text x="1204" y="266" text-anchor="middle" font-size="11.5" fill="#047857">(时变 SVF 滤波器 / 受控多项式 ADAA / 可变增益级)</text>
  <line x1="1384" y1="250" x2="1436" y2="250" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <rect x="1440" y="232" width="72" height="36" rx="6" fill="#059669"/><text x="1476" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">ŷ[n]</text>

  
  <rect x="960" y="294" width="340" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="1130" y="319" text-anchor="middle" font-size="12.1" font-weight="bold" fill="#92400E">控制率轻量 GRU / MLP 调制器 θ[n] = g_NN(s_env, 旋钮 c)</text>
  <line x1="940" y1="250" x2="940" y2="314" stroke="#D97706" stroke-width="1.8"/>
  <line x1="940" y1="314" x2="956" y2="314" stroke="#D97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <line x1="1204" y1="294" x2="1204" y2="280" stroke="#D97706" stroke-width="2.2" marker-end="url(#arr-amber)"/>

  <text x="836" y="370" font-size="13" fill="#334155">• <tspan font-weight="bold">数学方程</tspan>：ŷ[n] = ∑_p c_p(h[n]) · φ_p(x[n])，其中隐状态 h[n] 每 L_ctrl = 16～32 采样更新一次</text>
  <text x="836" y="396" font-size="13" fill="#334155">• <tspan font-weight="bold">核心优势</tspan>：音频通路 100% 为无混叠白盒算子，且控制率降采样使神经网络算力开销降低 16～32 倍</text>
  <text x="836" y="422" font-size="13" font-weight="bold" fill="#065F46">• 适用场景：光电/电子管压限器 (LA-2A/Vari-Mu) 非线性光敏电阻记忆、电源轨动态下垂 (Sag)</text>
  <text x="836" y="446" font-size="12.5" fill="#475569">• 稳定性保障：通过 Sigmoid/Softplus 将调制参数 θ[n] 严格限制在白盒滤波器稳定域内 (如 r_pole ∈ (0, 0.995))</text>

  
    <rect x="48" y="474" width="736" height="316" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="474" width="736" height="54" rx="14" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="48" y="516" width="736" height="12" fill="#FEF3C7"/>
  <line x1="48" y1="528" x2="784" y2="528" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="68" y="498" font-size="17" font-weight="bold" fill="#78350F">模式 ③ 串联分块级联型 (Serial Block-Oriented Cascade)</text>
  <text x="68" y="518" font-size="12.5" fill="#78350F">按硬件物理电路拓扑将白盒滤波级与神经非线性级串联交替</text>
  <rect x="68" y="540" width="696" height="134" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  
  <rect x="84" y="586" width="56" height="36" rx="6" fill="#0F172A"/><text x="112" y="609" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">x[n]</text>
  <line x1="140" y1="604" x2="168" y2="604" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="172" y="576" width="156" height="56" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="250" y="600" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">前级白盒 LTI / WDF</text>
  <text x="250" y="618" text-anchor="middle" font-size="11" fill="#0369A1">输入分压与音色旋钮电路</text>
  <line x1="328" y1="604" x2="356" y2="604" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="360" y="576" width="168" height="56" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="444" y="600" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5B21B6">核心非线性级 (NN / V2-L)</text>
  <text x="444" y="618" text-anchor="middle" font-size="11" fill="#6D28D9">多级电子管推挽失真核</text>
  <line x1="528" y1="604" x2="556" y2="604" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-purple)"/>

  <rect x="560" y="576" width="156" height="56" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="638" y="600" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#065F46">后级白盒箱体 / 变压器</text>
  <text x="638" y="618" text-anchor="middle" font-size="11" fill="#047857">Tone Stack + Cab IR</text>

  <text x="68" y="700" font-size="13" fill="#334155">• <tspan font-weight="bold">数学方程</tspan>：ŷ = H_post ∘ N_core ∘ H_pre(c_knob) [x]（广义 Wiener–Hammerstein 物理分块级联）</text>
  <text x="68" y="726" font-size="13" fill="#334155">• <tspan font-weight="bold">核心优势</tspan>：无需让神经网络重复学习已知的无源 RC 音色网络 (Tone Stack)，旋钮响应 100% 符合真实电路公式</text>
  <text x="68" y="752" font-size="13" font-weight="bold" fill="#B45309">• 适用场景：含复杂前/后级均衡旋钮的吉他放大器、硬件均衡+饱和通道条 (Neve 1073 / API 550)</text>
  <text x="68" y="776" font-size="12.5" fill="#475569">• 辨识注意：级联各块之间存在增益尺度模糊 (c·H_pre 与 c⁻¹·N_core)，需在块接口处施加单位范数归一化</text>

  
    <rect x="816" y="474" width="736" height="316" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="816" y="474" width="736" height="54" rx="14" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="816" y="516" width="736" height="12" fill="#EDE9FE"/>
  <line x1="816" y1="528" x2="1552" y2="528" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="836" y="498" font-size="17" font-weight="bold" fill="#5B21B6">模式 ④ 白盒方程内嵌局部元件代理型 (Local Component Surrogate)</text>
  <text x="836" y="518" font-size="12.5" fill="#5B21B6">保持 DAE / DK状态空间 / WDF 拓扑守恒，仅用微型 MLP/LUT 代理局部非线性端口</text>
  <rect x="836" y="540" width="696" height="134" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  
  <rect x="860" y="558" width="284" height="96" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="1002" y="582" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">线性基尔霍夫 / DK 状态空间骨架</text>
  <text x="1002" y="604" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#0F172A">s[n] = A·s[n-1] + B·x[n] + C·i_nl</text>
  <text x="1002" y="626" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#0369A1">p[n] = D·s[n-1] + E·x[n]</text>
  <text x="1002" y="644" text-anchor="middle" font-size="11" fill="#475569">(严格遵守能量守恒与电容电感拓扑)</text>

  <line x1="1144" y1="586" x2="1224" y2="586" stroke="#0284C7" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <text x="1184" y="578" text-anchor="middle" font-size="11" font-weight="bold" fill="#075985">端口电压 v_nl</text>
  <line x1="1224" y1="626" x2="1144" y2="626" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arr-purple)"/>
  <text x="1184" y="644" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B21B6">端口电流 i_nl</text>

  <rect x="1228" y="558" width="280" height="96" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="1368" y="582" text-anchor="middle" font-size="13" font-weight="bold" fill="#5B21B6">局部无源元件代理 i_nl = g_θ(v_nl)</text>
  <text x="1368" y="604" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#6D28D9">v_nl - K·g_θ(v_nl) = p[n]</text>
  <text x="1368" y="626" text-anchor="middle" font-size="11.5" fill="#059669" font-weight="bold">离线预解编译为 1D/2D 单调插值 LUT</text>
  <text x="1368" y="644" text-anchor="middle" font-size="11" fill="#475569">(三极管栅极-阴极 / 光敏电阻 V-I 曲线)</text>

  <text x="836" y="700" font-size="13" fill="#334155">• <tspan font-weight="bold">数学方程</tspan>：仅用单调约束 MLP (v·g_θ(v) ≥ 0, g'_θ(v) ≥ 0) 拟合 SPICE 手册失准的实测有源器件本构关系</text>
  <text x="836" y="726" font-size="13" fill="#334155">• <tspan font-weight="bold">核心优势</tspan>：离线将隐式方程 p ↦ i_nl 预计算为三次样条查找表 (LUT)，实时运行免除牛顿迭代与矩阵求逆</text>
  <text x="836" y="752" font-size="13" font-weight="bold" fill="#5B21B6">• 适用场景：高精度白盒电路仿真修正 (DK-Method / WDF)、实测电子管老化的个体差异校准</text>
  <text x="836" y="776" font-size="12.5" fill="#475569">• 无源性铁律：代理函数必须满足第一/第三象限扇区条件与增量无源性，确保隐式方程全局唯一解</text>

  
  <rect x="48" y="802" width="1504" height="84" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="68" y="818" width="236" height="52" rx="8" fill="#059669"/>
  <text x="186" y="841" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">跨模式顶层收敛机制</text>
  <text x="186" y="861" text-anchor="middle" font-size="12" fill="#D1FAE5">离线教师 → 实时学生知识蒸馏</text>
  <text x="324" y="836" font-size="13.5" font-weight="bold" fill="#065F46">无论离线研究阶段采用上述哪种混合模式（或高维 WaveNet/LSTM），最终商业发行版均可蒸馏至纯结构化实时学生模型：</text>
  <text x="324" y="862" font-size="13" fill="#334155">离线教师模型生成海量多电平/多频合成数据 → 闭式/凸回归拟合「LTI + V2-L + RD-Play + Bilinear SSM + LUT」学生结构 → 彻底剥离实时神经网络算力负担。</text>


  
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="15.5" font-weight="bold" fill="#F8FAFC">核心结论：神经网络不应盲目替代全部已知的基尔霍夫电路与线性滤波器；按物理耦合位置选择四种协同模式，可同时兼顾高精度、可解释旋钮与超低 CPU 占用。</text>
</svg>
