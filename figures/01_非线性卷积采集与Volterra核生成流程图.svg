  <!-- Step 4 Content -->
  <rect x="68" y="650" width="420" height="214" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="86" y="676" font-size="14" font-weight="bold" fill="#065F46">多电平核簇 H_p^(A_r) 与多方差反演 (Schoukens 1997)：</text>
  <text x="86" y="702" font-size="13" fill="#334155">• 单电平局限：在 0 dBFS 下截断 P=3 拟合时，5/7 阶余项被投影</text>
  <text x="100" y="724" font-size="13" fill="#334155">污染至 ĥ₁, ĥ₃，导致 -20 dBFS 小信号频响与失真严重失真</text>
  <text x="86" y="750" font-size="13" font-weight="bold" fill="#047857">• Vandermonde 多电平解耦：利用 γ_r^p 尺度幂律分离真实底层核</text>
  <text x="86" y="776" font-size="13" fill="#334155">• 动态采样插值 (Acustica VVKT)：按瞬时包络 e[n] 在分档核簇</text>
  <text x="100" y="798" font-size="13" fill="#334155">{h_p^(A₁), h_p^(A₂), …, h_p^(A_R)} 之间执行实时双线性交叉淡入淡出</text>
  <text x="86" y="826" font-size="12.5" fill="#065F46">• 优势：兼顾微弱信号线性度与大信号推挽饱和的平滑过渡</text>

  <!-- Mini 2D Grid visual inside Step 4 -->
  <rect x="504" y="650" width="260" height="214" rx="10" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="634" y="674" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">包络电平 × 阶数 2D 核向量网格</text>
  <!-- Grid cells -->
  <text x="530" y="702" font-size="11.5" font-weight="bold" fill="#475569">电平\阶</text>
  <text x="595" y="702" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0284C7">p=1</text>
  <text x="655" y="702" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#D97706">p=2</text>
  <text x="715" y="702" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7C3AED">p=3</text>
  <rect x="570" y="712" width="50" height="28" rx="4" fill="#E0F2FE" stroke="#0284C7"/><text x="595" y="730" text-anchor="middle" font-size="11" fill="#075985">h₁⁽⁻¹⁸⁾</text>
  <rect x="630" y="712" width="50" height="28" rx="4" fill="#FEF3C7" stroke="#D97706"/><text x="655" y="730" text-anchor="middle" font-size="11" fill="#92400E">h₂⁽⁻¹⁸⁾</text>
  <rect x="690" y="712" width="50" height="28" rx="4" fill="#EDE9FE" stroke="#7C3AED"/><text x="715" y="730" text-anchor="middle" font-size="11" fill="#5B21B6">h₃⁽⁻¹⁸⁾</text>
  <text x="542" y="730" text-anchor="middle" font-size="11" fill="#334155">-18dB</text>

  <rect x="570" y="748" width="50" height="28" rx="4" fill="#BAE6FD" stroke="#0284C7"/><text x="595" y="766" text-anchor="middle" font-size="11" fill="#075985">h₁⁽⁻⁶⁾</text>
  <rect x="630" y="748" width="50" height="28" rx="4" fill="#FDE68A" stroke="#D97706"/><text x="655" y="766" text-anchor="middle" font-size="11" fill="#92400E">h₂⁽⁻⁶⁾</text>
  <rect x="690" y="748" width="50" height="28" rx="4" fill="#DDD6FE" stroke="#7C3AED"/><text x="715" y="766" text-anchor="middle" font-size="11" fill="#5B21B6">h₃⁽⁻⁶⁾</text>
  <text x="542" y="766" text-anchor="middle" font-size="11" fill="#334155">-6dB</text>

  <rect x="570" y="784" width="50" height="28" rx="4" fill="#7DD3FC" stroke="#0284C7"/><text x="595" y="802" text-anchor="middle" font-size="11" font-weight="bold" fill="#075985">h₁⁽⁰⁾</text>
  <rect x="630" y="784" width="50" height="28" rx="4" fill="#FCD34D" stroke="#D97706"/><text x="655" y="802" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">h₂⁽⁰⁾</text>
  <rect x="690" y="784" width="50" height="28" rx="4" fill="#C4B5FD" stroke="#7C3AED"/><text x="715" y="802" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B21B6">h₃⁽⁰⁾</text>
  <text x="542" y="802" text-anchor="middle" font-size="11" fill="#334155">0dB</text>
  <text x="634" y="840" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#059669">↑ 实时包络权重 w_r(e[n]) 插值 ↓</text>

  <!-- Step 5 Content -->
  <rect x="836" y="650" width="696" height="214" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="856" y="678" font-size="14.5" font-weight="bold" fill="#991B1B">突破 ESS 对角核局限的三条高保真升级路线：</text>
  <rect x="856" y="694" width="656" height="48" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="872" y="716" font-size="13.5" font-weight="bold" fill="#7F1D1D">① 随机多正弦 (Random-Phase Multisine) / 双脉冲扫描 (Doublet Scan)：</text>
  <text x="872" y="734" font-size="12.5" fill="#475569">激发和频/差频 ω₁ ± ω₂，完整辨识近对角带状交叉核 h₂[k₁, k₁+d] (1 ≤ d ≤ D)</text>

  <rect x="856" y="750" width="656" height="48" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="872" y="772" font-size="13.5" font-weight="bold" fill="#7F1D1D">② Laguerre 正交基投影 (Laguerre-Volterra Network)：</text>
  <text x="872" y="790" font-size="12.5" fill="#475569">用 K=6～10 个一阶全通级联正交状态替代 M=256 原始延迟抽头，交叉核参数压缩 100 倍以上</text>

  <rect x="856" y="806" width="656" height="48" rx="8" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="872" y="828" font-size="13.5" font-weight="bold" fill="#7F1D1D">③ 显式状态算子与混合神经残差 (Play 磁滞 + 递归包络 + 轻量 GRU)：</text>
  <text x="872" y="846" font-size="12.5" fill="#475569">将长时压缩器时间常数与磁芯多分支磁滞从有限窗 Volterra 核中剥离，交由显式状态方程承担</text>


  <!-- Bottom Dark Summary Bar -->
