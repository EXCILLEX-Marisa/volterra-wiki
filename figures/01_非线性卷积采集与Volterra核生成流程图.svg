  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="190" height="28" rx="6" fill="#0F172A"/>
  <text x="163.0" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 01-03 · 非线性卷积采集</text>
  <text x="274" y="70" font-size="27" font-weight="bold" fill="#0F172A">指数扫频 (ESS) 非线性卷积采集与 Volterra 核生成全流程图</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">涵盖 Farina 负时间区谐波脉冲簇分离、Chebyshev 幂次解耦矩阵 T_c⁻¹、多方差电平插值与非对角交叉核补全</text>


  <!-- Top 3 Pipeline Cards -->
    <rect x="48" y="144" width="480" height="420" rx="14" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="144" width="480" height="54" rx="14" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.5"/>
  <rect x="48" y="186" width="480" height="12" fill="#E0F2FE"/>
