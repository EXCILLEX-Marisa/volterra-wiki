  <!-- Column 1 Content: Fractional Calculus & Oustaloup -->
  <rect x="68" y="210" width="440" height="310" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="86" y="236" font-size="14" font-weight="bold" fill="#92400E">1. 为什么真实模拟硬件常表现为幂律衰减 t^(-α) 而非纯指数衰减？</text>
  <text x="86" y="262" font-size="12.5" fill="#334155">• 电解电容介质极化、扬声器折环粘弹性蠕变与光敏电阻 (CdS) 载流子复合均遵循分数阶微分方程：</text>
  <rect x="86" y="276" width="404" height="46" rx="6" fill="#FFFFFF" stroke="#D97706"/>
  <text x="288" y="304" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#78350F">D_t^α s(t) + λ · s(t) = g(x(t)),   0 &lt; α &lt; 1  (H(s) = 1/(s^α + λ))</text>

  <!-- Log-log decay plot: Power-law t^-alpha vs single exponential -->
  <rect x="86" y="334" width="404" height="172" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="288" y="354" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400E">双对数坐标下：幂律长尾 t^(-α) vs 单一指数极点 e^(-t/τ) 截断</text>
  <line x1="114" y1="478" x2="466" y2="478" stroke="#64748B" stroke-width="1.2"/>
  <line x1="114" y1="366" x2="114" y2="478" stroke="#64748B" stroke-width="1.2"/>
  <!-- Straight line in log-log = power law t^-alpha -->
  <line x1="124" y1="376" x2="454" y2="464" stroke="#D97706" stroke-width="3"/>
  <!-- Single exponential drops off cliff -->
  <path d="M 124 376 Q 230 390 280 476 L 454 477" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="4 2"/>
  <text x="370" y="428" font-size="11" font-weight="bold" fill="#B45309">真实幂律尾 t^(-α)</text>
  <text x="230" y="468" font-size="11" font-weight="bold" fill="#DC2626">单极点过早归零</text>
  <text x="288" y="496" text-anchor="middle" font-size="10.5" fill="#475569">log₁₀(t) 跨越 0.1 ms ～ 1000 ms (4 个十倍频程)</text>

  <!-- Oustaloup Pole-Zero Interlacing -->
  <rect x="68" y="534" width="440" height="328" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="86" y="560" font-size="14" font-weight="bold" fill="#0F172A">2. Oustaloup 极零点对数交错有理逼近（秒级实时实现分数阶核）：</text>
  <text x="86" y="586" font-size="12.5" fill="#334155">• 直接用 FIR 截取 t^(-α) 需数万抽头；Oustaloup 在负实轴上按等比级数</text>
  <text x="86" y="606" font-size="12.5" fill="#334155">  交替放置 N=5～7 对实极点 (-ω_k) 与实零点 (-ω'_k)：</text>

  <!-- Pole-Zero Alternating Axis Diagram -->
  <rect x="86" y="620" width="404" height="96" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="288" y="640" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0F172A">s 平面负实轴极点 (✕) 与零点 (○) 对数等比交错排列</text>
  <line x1="106" y1="676" x2="470" y2="676" stroke="#475569" stroke-width="1.5"/>
  <line x1="454" y1="652" x2="454" y2="700" stroke="#475569" stroke-width="1.5"/>
  <!-- Alternating X and O -->
  <text x="424" y="681" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">✕</text>
  <circle cx="394" cy="676" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="360" y="681" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">✕</text>
  <circle cx="324" cy="676" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="284" y="681" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">✕</text>
  <circle cx="242" cy="676" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="196" y="681" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">✕</text>
  <circle cx="148" cy="676" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="288" y="704" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">仅用 N=6 个并联一阶 IIR 状态即可复现 1 Hz ～ 10 kHz 恒相位角 -απ/2！</text>

  <text x="86" y="742" font-size="12.5" fill="#334155">• <tspan font-weight="bold">部分分式并联展开</tspan>：H_frac(z) = ∑_{k=1}^N r_k / (1 - p_k z⁻¹)</text>
  <text x="86" y="768" font-size="12.5" fill="#334155">• <tspan font-weight="bold">工程应用</tspan>：LA-2A 光敏电阻 T4B 的多时间尺度释放尾（快释放 60 ms</text>
  <text x="100" y="790" font-size="12.5" fill="#334155">向慢释放 1～5 s 平滑过渡）本质上正是 α ≈ 0.45 的分数阶弛豫过程！</text>
  <text x="86" y="818" font-size="12.5" font-weight="bold" fill="#B45309">• 算力开销：N=6 阶并联一阶状态每采样点仅需 12 次乘加，零 FFT 延迟</text>

  <!-- Column 2 Content: Wiener G-Functionals & Polynomial Chaos Expansion (PCE) -->
  <rect x="580" y="210" width="440" height="330" rx="10" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="598" y="236" font-size="14" font-weight="bold" fill="#5B21B6">1. Wiener G-泛函正交化与 Lee–Schetzen 互相关辨识：</text>
  <text x="598" y="262" font-size="12.5" fill="#334155">• 原始 Volterra 项 H_p[x] 在高斯白噪声 w[n] ~ N(0, σ_x²) 下彼此非正交</text>
  <text x="598" y="282" font-size="12.5" fill="#334155">  （如 E[x²[n]] = σ_x² ≠ 0 污染常数项，x³[n] 污染线性项 3σ_x²x[n]）；</text>
  <text x="598" y="304" font-size="12.5" font-weight="bold" fill="#6D28D9">• Wiener 通过泛函 Gram–Schmidt 正交化构造互不相关的 G_p 泛函：</text>

  <rect x="598" y="318" width="404" height="104" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="614" y="342" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#0F172A">G₀ = k₀</text>
  <text x="614" y="362" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#0284C7">G₁[k₁; x] = ∑ k₁[m] x[n-m]</text>
  <text x="614" y="384" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#5B21B6">G₂[k₂; x] = ∑∑ k₂[m₁,m₂] x[n-m₁]x[n-m₂] - σ_x² ∑ k₂[m,m]</text>
  <text x="614" y="406" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#7C3AED">G₃[k₃; x] = H₃[k₃; x] - 3σ_x² ∑∑ k₃[m₁,m,m] x[n-m₁]</text>

  <text x="598" y="446" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#059669">正交性质 E[G_p · G_q] = 0 (p ≠ q)</tspan>：直接通过高阶输入-输出互相关</text>
  <text x="612" y="468" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#065F46">k_p(τ₁,…,τ_p) = ( 1 / (p! · σ_x^(2p)) ) · E[ y_res[n] · ∏ x[n-τ_i] ]</text>
  <text x="598" y="492" font-size="12.5" fill="#334155">  免除大型矩阵求逆，且截断阶数从 P=3 升至 P=5 时无需重算已求出的低阶核！</text>
  <text x="598" y="518" font-size="12" font-weight="bold" fill="#5B21B6">• 离散有限样本修正：实测有限长序列下建议结合 Cholesky/QR 再正交化</text>

  <!-- PCE for Analog Tolerance Modeling -->
  <rect x="580" y="554" width="440" height="308" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="598" y="580" font-size="14" font-weight="bold" fill="#065F46">2. 多项式混沌展开 (PCE) —— 模拟硬件元件公差与个体差异建模：</text>
  <text x="598" y="606" font-size="12.5" fill="#334155">• 真实模拟硬件的电阻/电容/电子管跨导存在 ±5%～10% 随机公差 ξ ~ U[-1,1]；</text>
  <text x="598" y="628" font-size="12.5" fill="#334155">• 将随机参数 ξ 按 Wiener–Askey 正交多项式 Ψ_α(ξ) 展开 Volterra 核：</text>

  <rect x="598" y="642" width="404" height="52" rx="6" fill="#FFFFFF" stroke="#059669"/>
  <text x="800" y="666" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#065F46">h_p(k ; ξ) = ∑_{|α| ≤ Q}  h_p^(α)(k) · Ψ_α(ξ₁, …, ξ_d)</text>
  <text x="800" y="684" text-anchor="middle" font-size="11" fill="#047857">(高斯分布参数选 Hermite 多项式 He_α；均匀分布选 Legendre 多项式 P_α)</text>

  <!-- Visual Plot: Mean response + +/- 2 sigma Tolerance Band -->
  <rect x="598" y="704" width="404" height="96" rx="8" fill="#FFFFFF" stroke="#A7F3D0"/>
  <path d="M 618 764 Q 720 712 820 744 T 980 732" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M 618 784 Q 720 744 820 772 T 980 762" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M 618 774 Q 720 728 820 758 T 980 747" fill="none" stroke="#065F46" stroke-width="2.8"/>
  <text x="800" y="724" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">均值核 h_p^(0) 与公差方差包络带 σ² = ∑ |h_p^(α)|² (Analog Tolerance Knob)</text>
  <text x="800" y="792" text-anchor="middle" font-size="10.5" fill="#047857">无需做 10,000 次蒙特卡洛仿真，PCE 一次算出立体声左/右通道微差分布！</text>

  <text x="598" y="824" font-size="12.5" font-weight="bold" fill="#065F46">• 商业插件价值：用户点击「Randomize Unit / L-R Component Tolerance」时，</text>
  <text x="612" y="844" font-size="12" fill="#334155">只需采样几个随机标量 ξ_i 即刻生成真实物理电路分布下的立体声模拟微差！</text>

  <!-- Column 3 Content: Fisher Information Matrix & D-Optimal Active Input Design -->
  <rect x="1092" y="210" width="440" height="350" rx="10" fill="#F0F9FF" stroke="#7DD3FC"/>
  <text x="1110" y="236" font-size="14" font-weight="bold" fill="#075985">1. Cramér–Rao 下界与 D-最优主动激励设计 (Active Input Design)：</text>
  <text x="1110" y="262" font-size="12.5" fill="#334155">• 观测噪声 e ~ N(0, σ_v² I) 下，任何无偏核估计器 θ̂ 的协方差受限于</text>
  <text x="1110" y="282" font-size="12.5" fill="#334155">  Fisher 信息矩阵 (FIM) ℐ(x) = σ_v⁻² Φ(x)ᵀ Φ(x) 的逆：</text>

  <rect x="1110" y="296" width="404" height="54" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="1312" y="320" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#075985">Cov(θ̂) ≥ ℐ(x)⁻¹ = σ_v² · ( Φ(x)ᵀ Φ(x) )⁻¹</text>
  <text x="1312" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#059669">D-最优准则：max_{‖x‖_∞ ≤ A}  ln det( Φ(x)ᵀ Φ(x) + λI )</text>

  <!-- Confidence Ellipsoid Shrinkage Diagram -->
  <rect x="1110" y="362" width="404" height="182" rx="8" fill="#FFFFFF" stroke="#BAE6FD"/>
  <text x="1312" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">参数空间 (θ₁, θ₂) 不确定性置信椭球体积 V ∝ det(ℐ)⁻¹/²</text>
  <line x1="1150" y1="464" x2="1474" y2="464" stroke="#94A3B8" stroke-width="1"/>
  <line x1="1312" y1="396" x2="1312" y2="532" stroke="#94A3B8" stroke-width="1"/>
  <!-- Poor excitation: elongated tilted ellipse -->
  <g transform="translate(1312,464) rotate(-28)">
    <ellipse cx="0" cy="0" rx="135" ry="26" fill="#FEE2E2" fill-opacity="0.55" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 2"/>
  </g>
  <!-- D-optimal excitation: small tight circle -->
  <circle cx="1312" cy="464" r="24" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
  <circle cx="1312" cy="464" r="4" fill="#0F172A"/>
  <text x="1204" y="416" font-size="11" font-weight="bold" fill="#DC2626">普通扫频/音乐：共线性强，椭球狭长</text>
  <text x="1388" y="492" font-size="11" font-weight="bold" fill="#065F46">D-最优激励：各向同性极小圆</text>
  <text x="1312" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369A1">解析结论：P=3 最优幅值分布并非高斯，而是集中在 ±1 与 ±0.45 的切比雪夫节点！</text>

  <!-- Column 3 Bottom: MDL / BIC & Coherence Diagnostics -->
  <rect x="1092" y="574" width="440" height="288" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="1110" y="600" font-size="14" font-weight="bold" fill="#0F172A">2. 最小描述长度 (MDL/BIC) 阶数锁定与相干函数 γ²(f) 审计：</text>
  <rect x="1110" y="614" width="404" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="1312" y="641" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#0F172A">BIC(P, K) = N · ln( MSE_val ) + d_eff(λ) · ln(N)</text>

  <text x="1110" y="682" font-size="12.5" fill="#334155">• <tspan font-weight="bold">自动结构选择</tspan>：当增加阶数 P 或记忆 K 带来的对数残差下降小于</text>
  <text x="1124" y="702" font-size="12.5" fill="#334155">有效自由度惩罚 d_eff·ln(N) 时，自动停止升维，防止拟合本底热噪声</text>
  <text x="1110" y="728" font-size="12.5" font-weight="bold" fill="#075985">• 线性与高阶相干分解审计 (Coherence Decomposition)：</text>
  <text x="1124" y="750" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#334155">1 = γ_lin²(f) + γ_V2L²(f) + γ_state²(f) + γ_unmodeled²(f)</text>
  <text x="1110" y="776" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#059669">诊断闭环</tspan>：在每个频点 f 上定量审计线性核、二阶核与状态支路各自</text>
  <text x="1124" y="798" font-size="12.5" fill="#334155">解释的功率谱比例；若某频段 γ_total²(f) &lt; 0.98 且本底信噪比高，</text>
  <text x="1124" y="820" font-size="12.5" font-weight="bold" fill="#991B1B">直接指示该频段存在未建模的交叉失真或混叠折叠伪影！</text>


  <!-- Bottom Dark Summary Bar -->
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
