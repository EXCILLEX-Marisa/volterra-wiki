    <text x="500" y="240" text-anchor="middle" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#D97706">支路 2..k：对角自乘幂次</text>
    <text x="500" y="264" text-anchor="middle" font-size="13.75" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#0F172A">u_p[n] = x^p[n] (SIMD 4路自乘)</text>
    <text x="500" y="286" text-anchor="middle" font-size="12" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">+ 可选静态点形器 (desoras/tanh)</text>
    <line x1="615" y1="255" x2="685" y2="255" stroke="#D97706" stroke-width="2.5" marker-end="url(#arr-diag)"/>
    <rect x="690" y="210" width="320" height="90" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="850" y="242" text-anchor="middle" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#D97706">各阶专属 FIR 核滤波 g_p[k]</text>
    <text x="850" y="268" text-anchor="middle" font-size="13" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">短核：手写 SIMD 汇编点积（NeAsBr01.dll）</text>
    <text x="850" y="288" text-anchor="middle" font-size="12" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#D97706">决定第 p 阶非线性成分的幅频与相频音色</text>
    <line x1="325" y1="400" x2="380" y2="400" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-cross)"/>
    <path d="M 650 125 L 650 350 L 500 350 L 500 358" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-cross)"/>
    <rect x="385" y="360" width="230" height="90" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="500" y="390" text-anchor="middle" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#7C3AED">支路 m：跨分支缓冲相乘</text>
    <text x="500" y="414" text-anchor="middle" font-size="14" font-weight="bold" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#0F172A">u_m[n] = buf_i[n] × buf_j[n]</text>
    <text x="500" y="436" text-anchor="middle" font-size="12" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#7C3AED">构造可分离非对角交叉项 a[k₁]b[k₂]。</text>
    <line x1="615" y1="405" x2="685" y2="405" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-cross)"/>
    <rect x="690" y="360" width="320" height="90" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="850" y="392" text-anchor="middle" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#7C3AED">交叉支路 FIR 滤波 g_m[k]</text>
    <text x="850" y="418" text-anchor="middle" font-size="13" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">无需存储 M² 全矩阵，以 O(M) 成本表达</text>
    <text x="850" y="438" text-anchor="middle" font-size="13" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">跨时刻互调牵引（总分支构造上限 ≤ 16）</text>
    <line x1="325" y1="545" x2="380" y2="545" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-state)"/>
    <rect x="385" y="505" width="625" height="80" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="697" y="538" text-anchor="middle" font-size="15.11" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#059669">模块内嵌动态层：峰值跟踪 → log×8.6858 (dB 换算) → 保持/释放计数器 (Hold / Release)</text>
    <text x="697" y="566" text-anchor="middle" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">使支路增益或工作点随节目包络 s_env[n] 缓慢呼吸（模拟磁带/电子管动态压缩感）</text>
    <circle cx="1105" cy="265" r="28" fill="#0F172A"/>
    <text x="1105" y="274" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFF">Σ</text>
    <line x1="1010" y1="125" x2="1082" y2="245" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arr-lin)"/>
    <line x1="1010" y1="255" x2="1077" y2="265" stroke="#D97706" stroke-width="2.5" marker-end="url(#arr-diag)"/>
    <line x1="1010" y1="405" x2="1082" y2="285" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-cross)"/>
    <line x1="1010" y1="545" x2="1105" y2="545" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="1105" y1="545" x2="1105" y2="298" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-state)"/>
    <line x1="1133" y1="265" x2="1185" y2="265" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-dark)"/>
    <rect x="1190" y="195" width="205" height="140" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <text x="1292" y="228" text-anchor="middle" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#DC2626">尾处理与安全上界</text>
    <text x="1292" y="256" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#0F172A">sgn(x)[atan(|x|^p)]^(1/p)</text>
    <text x="1292" y="282" text-anchor="middle" font-size="12" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">渐近饱和上界 (π/2)^(1/p)</text>
    <text x="1292" y="304" text-anchor="middle" font-size="12" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">+ ceiling 变体 ±1 钳制</text>
    <line x1="1395" y1="265" x2="1425" y2="265" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-dark)"/>
    <circle cx="1455" cy="265" r="26" fill="#7C3AED"/>
    <text x="1455" y="271" text-anchor="middle" font-size="16" font-weight="bold" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#FFF">ŷ[n]</text>
    <rect x="28" y="612" width="1448" height="94" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="48" y="642" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">工程解读与证据边界（见《02》§2.13.1 与 §2.19）：</text>
    <text x="48" y="670" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">1. 报告所示结构支持这样的判断：相关引擎并非直接计算 M^P 完整张量，而是采用【并联 Hammerstein + 因子化交叉乘法 + 有界点形器 + 包络状态】的组合结构；</text>
    <text x="48" y="694" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">2. 16 条分支是所检查工厂函数的循环构造上限，具体产品档位实际启用几条对角或交叉支路，储存在尚未解密的 .N2V/.N2S 资源中。</text>
  </g>
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#F8FAFC">核心要义：Acustica 底层分支库将“对角幂次滤波”、“跨缓冲因子化交叉项”与“有界点形器”做成了可由程序数据编排的通用算子图。</text>
