    <text x="850" y="144" text-anchor="middle" font-size="13" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">长核：多线程分块重叠相加 FFT（Intel IPP）</text>
    <line x1="325" y1="255" x2="380" y2="255" stroke="#D97706" stroke-width="2.5" marker-end="url(#arr-diag)"/>
