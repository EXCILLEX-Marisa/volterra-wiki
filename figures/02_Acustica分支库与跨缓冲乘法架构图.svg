    <text x="500" y="144" font-size="14" text-anchor="middle" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#0F172A">u₁[n] = x[n]（缓冲复制）</text>
    <line x1="615" y1="125" x2="685" y2="125" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arr-lin)"/>
