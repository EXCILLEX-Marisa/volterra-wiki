  <text x="216" y="70" font-size="28" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">商业 Volterra 分支库（simplefirvolterra / clippedfirvolterra）的工程运算图</text>
  <text x="68" y="104" font-size="16" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">对应《02》§2.7 与 §2.13.1：依据公开资料与静态逆向线索抽象的“≤16 可配置支路 + 跨缓冲因子化乘法 + 分区 FFT + 模块内动态层”</text>

  <g transform="translate(48, 144)">
    <rect x="0" y="0" width="1504" height="730" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1504" height="50" rx="16" fill="#0F172A"/>
    <text x="24" y="32" font-size="19" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#FFFFFF">可编排分支库信号流（证据边界：展示引擎支持的模块原语与组合能力，具体预设启用哪些支路取决于加密 .N2V/.N2S 资源）</text>
    <circle cx="65" cy="310" r="28" fill="#0284C7"/>
    <text x="65" y="316" text-anchor="middle" font-size="16" font-weight="bold" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#FFF">x[n]</text>
