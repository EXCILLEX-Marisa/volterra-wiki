    <text x="210" y="298" text-anchor="middle" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">输入增益转换</text>
    <text x="210" y="322" text-anchor="middle" font-size="13" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#475569">10^(dB/20)</text>
    <text x="210" y="342" text-anchor="middle" font-size="11" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#64748B">(clipped 变体含)</text>
    <line x1="275" y1="310" x2="325" y2="310" stroke="#334155" stroke-width="3"/>
