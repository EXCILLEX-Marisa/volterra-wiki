  <text x="300" y="70" font-size="27" font-weight="bold" fill="#0F172A">Fréchet 泛函导数偏置收缩、Boyd–Chua 衰减记忆定理与 Koopman/Carleman 线性提升图</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">从无穷维泛函分析视角阐明工作点漂移衍生偶次谐波、磁滞违反衰减记忆公理及非线性状态空间的线性化提升</text>


