  <!-- Background -->
  <rect width="1600" height="980" fill="#F8FAFC"/>

  <!-- Top Header Card -->
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="190" height="28" rx="6" fill="#0F172A"/>
  <text x="163.0" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 01-15 · 系统辨识全流程</text>
  <text x="274" y="70" font-size="27" font-weight="bold" fill="#0F172A">Volterra 非线性音频系统辨识与实时工程部署六阶段标准流程</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">串联先验诊断、广义持续激励 (PE) 设计、结构化正交基参数化、正则化低秩求解、抗混叠压力验收与 SIMD 实时部署</text>


  <!-- 3x2 Grid of 6 Detailed Pipeline Cards with Embedded Visual Schematics -->

  <!-- Stage 1 -->
    <rect x="48" y="144" width="480" height="350" rx="14" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="144" width="480" height="54" rx="14" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.5"/>
  <rect x="48" y="186" width="480" height="12" fill="#E0F2FE"/>
  <line x1="48" y1="198" x2="528" y2="198" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="68" y="168" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="68" y="188" font-size="12.5" fill="{dark}">{subtitle}</text>
  <rect x="68" y="210" width="440" height="110" rx="8" fill="#F0F9FF" stroke="#BAE6FD"/>
  <!-- Loopback schematic -->
  <rect x="84" y="236" width="84" height="46" rx="6" fill="#0284C7"/><text x="126" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">激励发生器</text>
  <line x1="168" y1="259" x2="206" y2="259" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="210" y="226" width="136" height="66" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="278" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400E">待测硬件 / 插件</text>
  <text x="278" y="274" text-anchor="middle" font-size="11" fill="#B45309">AD/DA 环回延迟 d₀</text>
  <line x1="346" y1="259" x2="384" y2="259" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="388" y="236" width="104" height="46" rx="6" fill="#059669"/><text x="440" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">亚采样对齐</text><text x="440" y="273" text-anchor="middle" font-size="10.5" fill="#D1FAE5">互相关峰值校准</text>
  <text x="288" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">Word Clock 硬件字时钟同步（杜绝 Δf_s 相位旋转）</text>

  <text x="68" y="346" font-size="13" fill="#334155">• <tspan font-weight="bold">小信号扫频</tspan>：在 -30 dBFS 测定线性脉冲响应尾长 → 锁定 M₁</text>
  <text x="68" y="372" font-size="13" fill="#334155">• <tspan font-weight="bold">阶梯双音测试</tspan>：观测谐波簇上限与偶/奇次对称性 → 锁定 P ≤ 5</text>
  <text x="68" y="398" font-size="13" fill="#334155">• <tspan font-weight="bold">直流与亚采样对齐</tspan>：移除 DC 偏置，Fractional Delay 对齐至 0.01 样本</text>
  <text x="68" y="424" font-size="13" font-weight="bold" fill="#0369A1">• 慢变筛查：若阶跃响应含 &gt; 50 ms 慢漂移，提前剥离包络支路</text>
  <text x="68" y="450" font-size="12.5" fill="#475569">• 输出：严格时间对齐的多电平训练对 {x^(r)[n], y^(r)[n]}</text>

  <!-- Stage 2 -->
    <rect x="560" y="144" width="480" height="350" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="560" y="144" width="480" height="54" rx="14" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="560" y="186" width="480" height="12" fill="#FEF3C7"/>
  <line x1="560" y1="198" x2="1040" y2="198" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="580" y="168" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="580" y="188" font-size="12.5" fill="{dark}">{subtitle}</text>
  <rect x="580" y="210" width="440" height="110" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
  <!-- 3 mini signal badges -->
  <rect x="594" y="222" width="130" height="86" rx="6" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="659" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400E">① 多电平 ESS</text>
  <path d="M 604 274 Q 620 250 636 274 T 664 274 Q 674 250 684 274 T 700 274 Q 706 250 712 274" fill="none" stroke="#D97706" stroke-width="2"/>
  <text x="659" y="298" text-anchor="middle" font-size="10.5" fill="#475569">锁定对角核 H_p,diag</text>

  <rect x="735" y="222" width="130" height="86" rx="6" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="800" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400E">② 随机相位多正弦</text>
  <path d="M 745 274 L 755 254 L 765 288 L 775 258 L 785 282 L 795 250 L 805 290 L 815 262 L 825 284 L 835 256 L 845 278" fill="none" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="800" y="298" text-anchor="middle" font-size="10.5" fill="#475569">激发 ω₁±ω₂ 交叉面</text>

  <rect x="876" y="222" width="130" height="86" rx="6" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="941" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400E">③ 双脉冲 / 音乐包络</text>
  <line x1="896" y1="286" x2="896" y2="252" stroke="#059669" stroke-width="3"/>
  <line x1="928" y1="286" x2="928" y2="256" stroke="#059669" stroke-width="3"/>
  <path d="M 950 286 Q 966 248 994 286" fill="none" stroke="#0284C7" stroke-width="2"/>
  <text x="941" y="298" text-anchor="middle" font-size="10.5" fill="#475569">探测差值延迟 d=k₂-k₁</text>

  <text x="580" y="346" font-size="13" fill="#334155">• <tspan font-weight="bold">高阶持续激励 (PE)</tspan>：单音仅能激励 1D 轨迹，必须混合多频与多幅值</text>
  <text x="580" y="372" font-size="13" fill="#334155">• <tspan font-weight="bold">多方差正态/均匀噪声</tspan>：覆盖 σ₁ &lt; σ₂ &lt; … &lt; σ_R 消除高阶回折偏差</text>
  <text x="580" y="398" font-size="13" fill="#334155">• <tspan font-weight="bold">粉红谱预加重</tspan>：匹配真实母带音乐 -3 dB/oct 能量分布与峰值因数</text>
  <text x="580" y="424" font-size="13" font-weight="bold" fill="#B45309">• 预热丢弃窗 (Washout)：每段开头丢弃 N_wash ≥ 2·M_max 消除初态</text>
  <text x="580" y="450" font-size="12.5" fill="#475569">• 输出：满秩低共线性特征激励数据集（80% 训练 / 20% 跨风格验证）</text>

  <!-- Stage 3 -->
    <rect x="1072" y="144" width="480" height="350" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1072" y="144" width="480" height="54" rx="14" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="1072" y="186" width="480" height="12" fill="#EDE9FE"/>
  <line x1="1072" y1="198" x2="1552" y2="198" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="1092" y="168" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="1092" y="188" font-size="12.5" fill="{dark}">{subtitle}</text>
  <rect x="1092" y="210" width="440" height="110" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
  <!-- Upper triangular + Banded visual + Orthogonal basis -->
  <rect x="1108" y="224" width="82" height="82" fill="#FFFFFF" stroke="#7C3AED"/>
  <polygon points="1108,224 1190,224 1190,306" fill="#EDE9FE"/>
  <polygon points="1108,224 1132,224 1190,282 1190,306" fill="#C4B5FD"/>
  <line x1="1108" y1="224" x2="1190" y2="306" stroke="#D97706" stroke-width="2.5"/>
  <text x="1206" y="246" font-size="12.5" font-weight="bold" fill="#5B21B6">1. 上三角折叠：k₁ ≤ k₂ ≤ … ≤ k_p</text>
  <text x="1206" y="268" font-size="12.5" font-weight="bold" fill="#6D28D9">2. 近对角带状剪枝：|k₂ - k₁| ≤ D</text>
  <text x="1206" y="290" font-size="12.5" font-weight="bold" fill="#059669">3. 正交基替换：P_p(x) 与 L_j(z)</text>
  <text x="1206" y="308" font-size="11.5" fill="#475569">条件数 κ(ΦᵀΦ) 下降 10⁴～10⁶ 倍</text>

  <text x="1092" y="346" font-size="13" fill="#334155">• <tspan font-weight="bold">阶梯记忆分配</tspan>：M₁ = 256 (线性 EQ)，M₂ = 48，M₃ = 24 (非线性核)</text>
  <text x="1092" y="372" font-size="13" fill="#334155">• <tspan font-weight="bold">幅值域正交化</tspan>：用移位 Legendre 多项式 P_p(x) 替代单项式 x^p</text>
  <text x="1092" y="398" font-size="13" fill="#334155">• <tspan font-weight="bold">时延域正交化</tspan>：用极点 α ∈ [0.5, 0.85] 的 Laguerre 全通基压缩长尾</text>
  <text x="1092" y="424" font-size="13" font-weight="bold" fill="#5B21B6">• 构造特征回归矩阵 Φ ∈ ℝ^(N × N_θ)：输出关于参数 θ 严格保持线性！</text>
  <text x="1092" y="450" font-size="12.5" fill="#475569">• 输出：良态、稀疏、物理可解释的回归基矩阵 Φ</text>

  <!-- Connectors Row 1 -> Row 2 -->
  <line x1="528" y1="319" x2="556" y2="319" stroke="#0284C7" stroke-width="3" marker-end="url(#arr-blue)"/>
  <line x1="1040" y1="319" x2="1068" y2="319" stroke="#D97706" stroke-width="3" marker-end="url(#arr-amber)"/>
  <path d="M 1312 494 L 1312 514 L 288 514 L 288 530" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- Stage 4 -->
    <rect x="48" y="534" width="480" height="348" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="534" width="480" height="54" rx="14" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="48" y="576" width="480" height="12" fill="#D1FAE5"/>
  <line x1="48" y1="588" x2="528" y2="588" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="68" y="558" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="68" y="578" font-size="12.5" fill="{dark}">{subtitle}</text>
  <rect x="68" y="600" width="440" height="106" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
  <!-- SVD singular value curve + diagonal penalty visual -->
  <line x1="88" y1="686" x2="250" y2="686" stroke="#64748B" stroke-width="1.2"/>
  <line x1="88" y1="616" x2="88" y2="686" stroke="#64748B" stroke-width="1.2"/>
  <path d="M 96 622 Q 130 676 242 683" fill="none" stroke="#059669" stroke-width="2.8"/>
  <line x1="154" y1="616" x2="154" y2="686" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4 2"/>
  <text x="158" y="632" font-size="11" font-weight="bold" fill="#991B1B">截断秩 R (σ_r &gt; τ)</text>
  <text x="168" y="700" text-anchor="middle" font-size="11" fill="#065F46">SVD 奇异值谱 σ₁ ≥ σ₂ ≥ …</text>
  <rect x="266" y="616" width="226" height="76" rx="6" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="379" y="638" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065F46">带距离惩罚的加权 Tikhonov 解：</text>
  <text x="379" y="660" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#0F172A">θ̂ = (ΦᵀΦ + ΓᵀΓ)⁻¹ Φᵀy</text>
  <text x="379" y="680" text-anchor="middle" font-size="11" fill="#047857">γ(k₁,k₂) = λ₀·exp(αk₁ + β|k₁-k₂|)</text>

  <text x="68" y="732" font-size="13" fill="#334155">• <tspan font-weight="bold">全局唯一闭式解</tspan>：无局部极小值困扰，秒级完成 QR / SVD 求解</text>
  <text x="68" y="758" font-size="13" fill="#334155">• <tspan font-weight="bold">二阶核特征分解</tspan>：H₂ = ∑_{r=1}^R σ_r u_r u_rᵀ 转化为 R 条并联 FIR+平方</text>
  <text x="68" y="784" font-size="13" fill="#334155">• <tspan font-weight="bold">三阶核 CP/PARAFAC 分解</tspan>：张量分解为 R₃ 组秩-1 外积支路</text>
  <text x="68" y="810" font-size="13" font-weight="bold" fill="#059669">• 稀疏选型：采用 LASSO / 弹性网自动剔除贡献 &lt; -80 dB 的冗余交叉项</text>
  <text x="68" y="836" font-size="12.5" fill="#475569">• 输出：并行低秩滤波支路权重与正交基系数向量 θ̂</text>

  <!-- Stage 5 -->
    <rect x="560" y="534" width="480" height="348" rx="14" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="560" y="534" width="480" height="54" rx="14" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="560" y="576" width="480" height="12" fill="#FEE2E2"/>
  <line x1="560" y1="588" x2="1040" y2="588" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="580" y="558" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="580" y="578" font-size="12.5" fill="{dark}">{subtitle}</text>
  <rect x="580" y="600" width="440" height="106" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <!-- Aliasing foldback plot -->
  <line x1="600" y1="684" x2="1000" y2="684" stroke="#64748B" stroke-width="1.2"/>
  <line x1="820" y1="614" x2="820" y2="690" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="820" y="626" text-anchor="middle" font-size="11" font-weight="bold" fill="#DC2626">Nyquist f_s/2</text>
  <!-- Fundamental and harmonics -->
  <line x1="660" y1="684" x2="660" y2="622" stroke="#0284C7" stroke-width="3"/><text x="660" y="618" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0284C7">f₀</text>
  <line x1="760" y1="684" x2="760" y2="638" stroke="#059669" stroke-width="2.5"/><text x="760" y="634" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">2f₀</text>
  <line x1="860" y1="684" x2="860" y2="646" stroke="#94A3B8" stroke-width="2" stroke-dasharray="2 2"/><text x="860" y="642" text-anchor="middle" font-size="10" fill="#64748B">3f₀ (超带)</text>
  <!-- Folded alias arrow -->
  <path d="M 860 646 Q 820 626 780 650" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="780" y1="684" x2="780" y2="652" stroke="#DC2626" stroke-width="2.5"/>
  <text x="730" y="658" font-size="10.5" font-weight="bold" fill="#991B1B">折叠伪影 f_s-3f₀</text>
  <text x="926" y="662" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">OS + ADAA 抑制 &gt; 40dB</text>

  <text x="580" y="732" font-size="13" fill="#334155">• <tspan font-weight="bold">综合客观指标</tspan>：时域 ESR + 多分辨率 STFT 谱收敛误差 + A 计权感知误差</text>
  <text x="580" y="758" font-size="13" fill="#334155">• <tspan font-weight="bold">泛化集测试</tspan>：在未参与训练的鼓组瞬态、贝斯与母带混音上检验误差</text>
  <text x="580" y="784" font-size="13" fill="#334155">• <tspan font-weight="bold">过载边界压力测试</tspan>：输入推至 +6 dBFS 检验 Padé/饱和保护是否无爆音</text>
  <text x="580" y="810" font-size="13" font-weight="bold" fill="#991B1B">• 抗混叠验收：5～15 kHz 正弦扫频下镜像折叠伪影必须低于 -80 dBFS</text>
  <text x="580" y="836" font-size="12.5" fill="#475569">• 输出：通过声学验收的定型核参数包与过采样倍率配置</text>

  <!-- Stage 6 -->
    <rect x="1072" y="534" width="480" height="348" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1072" y="534" width="480" height="54" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="1072" y="576" width="480" height="12" fill="#F1F5F9"/>
  <line x1="1072" y1="588" x2="1552" y2="588" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1092" y="558" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="1092" y="578" font-size="12.5" fill="{dark}">{subtitle}</text>
  <rect x="1092" y="600" width="440" height="106" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <!-- Hybrid Direct FIR + Partitioned FFT + SIMD blocks -->
  <rect x="1108" y="618" width="124" height="70" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="1170" y="644" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">首段直接时域 FIR</text>
  <text x="1170" y="664" text-anchor="middle" font-size="11" fill="#0369A1">k ∈ [0, 31] 零延迟</text>
  <text x="1170" y="680" text-anchor="middle" font-size="10" fill="#075985">AVX2 FMA 4 路并行</text>

  <rect x="1248" y="618" width="132" height="70" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="1314" y="644" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5B21B6">尾段非均匀分段 FFT</text>
  <text x="1314" y="664" text-anchor="middle" font-size="11" fill="#6D28D9">k ≥ 32 频域乘累加</text>
  <text x="1314" y="680" text-anchor="middle" font-size="10" fill="#5B21B6">共享前向 FFT 谱</text>

  <rect x="1396" y="618" width="120" height="70" rx="6" fill="#D1FAE5" stroke="#059669"/>
  <text x="1456" y="644" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065F46">多项式 ADAA1</text>
  <text x="1456" y="664" text-anchor="middle" font-size="11" fill="#047857">Horner 嵌套求值</text>
  <text x="1456" y="680" text-anchor="middle" font-size="10" fill="#065F46">0.5 采样对齐</text>

  <text x="1092" y="732" font-size="13" fill="#334155">• <tspan font-weight="bold">频域共享优化</tspan>：多支路二阶/三阶核在频域累加后再执行单次逆 IFFT</text>
  <text x="1092" y="758" font-size="13" fill="#334155">• <tspan font-weight="bold">内存布局</tspan>：环形缓冲区 64-byte 缓存行对齐，消除跨行读取惩罚</text>
  <text x="1092" y="784" font-size="13" fill="#334155">• <tspan font-weight="bold">硬件异常防护</tspan>：开启 FTZ / DAZ 寄存器标志，彻底杜绝次正规数 CPU 尖峰</text>
  <text x="1092" y="810" font-size="13" font-weight="bold" fill="#0F172A">• 实时红线：processBlock 全程零 malloc、零互斥锁、零文件 I/O</text>
  <text x="1092" y="836" font-size="12.5" fill="#475569">• 输出：达到商业母带插件级稳定性的 VST3 / AU / AAX 实时音频引擎</text>

