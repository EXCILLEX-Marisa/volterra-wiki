  <rect width="1600" height="980" fill="#F8FAFC"/>

  
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="234" height="28" rx="6" fill="#0F172A"/>
  <text x="184.9" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 03-01 · 混合建模平台总架构</text>
  <text x="318" y="70" font-size="27" font-weight="bold" fill="#0F172A">混合建模研究平台总体架构图（三时间尺度物理分治 × 受控神经残差 × 教师-学生蒸馏）</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">融合 Volterra/Laguerre 正交核、Play 磁滞、双线性包络状态空间与轻量神经网络的现代音频插件研发体系</text>


  
  <rect x="48" y="142" width="1504" height="106" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="68" y="170" font-size="16" font-weight="bold" fill="#0F172A">物理分治总纲：按记忆时间尺度与算子光滑度将黑盒硬件解耦为四个正交子空间</text>

  
  <rect x="68" y="182" width="350" height="54" rx="8" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="84" y="204" font-size="13" font-weight="bold" fill="#075985">① 线性色散底座 H₁(z) (0～50 ms)</text>
  <text x="84" y="224" font-size="11.5" fill="#0369A1">分立 IIR/FIR 承担 90%+ 幅频与群延迟</text>
  <path d="M 346 224 Q 366 188 406 218" fill="none" stroke="#0284C7" stroke-width="2.5"/>

  <rect x="434" y="182" width="356" height="54" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="450" y="204" font-size="13" font-weight="bold" fill="#92400E">② 瞬时与短记忆核 (0～10 ms)</text>
  <text x="450" y="224" font-size="11.5" fill="#B45309">ADAA 多项式 + Laguerre 二阶核 V2-L</text>
  <path d="M 718 224 C 736 224, 744 192, 774 192" fill="none" stroke="#D97706" stroke-width="2.5"/>

  <rect x="806" y="182" width="356" height="54" rx="8" fill="#D1FAE5" stroke="#059669"/>
  <text x="822" y="204" font-size="13" font-weight="bold" fill="#065F46">③ 慢变状态与磁滞 (10～1000 ms + 剩磁)</text>
  <text x="822" y="224" font-size="11.5" fill="#047857">RD-Play 磁滞算子 + 双线性包络 SSM</text>
  <ellipse cx="1126" cy="209" rx="22" ry="12" fill="none" stroke="#059669" stroke-width="2.2"/>

  <rect x="1178" y="182" width="354" height="54" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="1194" y="204" font-size="13" font-weight="bold" fill="#5B21B6">④ 高阶未建模残差 (&lt; 10% 能量)</text>
  <text x="1194" y="224" font-size="11.5" fill="#6D28D9">轻量 Micro-WaveNet / GRU 或离线教师蒸馏</text>
  <path d="M 1468 212 L 1478 198 L 1488 222 L 1498 204 L 1514 214" fill="none" stroke="#7C3AED" stroke-width="2"/>

  
    <rect x="48" y="264" width="460" height="618" rx="14" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="264" width="460" height="54" rx="14" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.5"/>
  <rect x="48" y="306" width="460" height="12" fill="#E0F2FE"/>
  <line x1="48" y1="318" x2="508" y2="318" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="68" y="288" font-size="17" font-weight="bold" fill="#075985">模块 I：多模态激励与多速率抗混叠前端</text>
  <text x="68" y="308" font-size="12.5" fill="#075985">同步采集校准 + 1× / ADAA / 4× 分支路由</text>
    <rect x="532" y="264" width="536" height="618" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="532" y="264" width="536" height="54" rx="14" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="532" y="306" width="536" height="12" fill="#D1FAE5"/>
  <line x1="532" y1="318" x2="1068" y2="318" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="552" y="288" font-size="17" font-weight="bold" fill="#065F46">模块 II：正交分解灰盒主干 + 受控神经残差核</text>
  <text x="552" y="308" font-size="12.5" fill="#065F46">并行/级联可解释算子簇 + 门控神经残差修补</text>
    <rect x="1092" y="264" width="460" height="618" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1092" y="264" width="460" height="54" rx="14" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="1092" y="306" width="460" height="12" fill="#EDE9FE"/>
  <line x1="1092" y1="318" x2="1552" y2="318" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="1112" y="288" font-size="17" font-weight="bold" fill="#5B21B6">模块 III：双阶段辨识与教师→学生实时蒸馏</text>
  <text x="1112" y="308" font-size="12.5" fill="#5B21B6">凸初始化 → 联合微调 → 高容量教师离线蒸馏</text>

  
  <rect x="68" y="330" width="420" height="156" rx="10" fill="#F0F9FF" stroke="#BAE6FD"/>
  <text x="86" y="356" font-size="14" font-weight="bold" fill="#075985">1. 完备激励信号库 (Combined Excitation Suite)：</text>
  <text x="86" y="382" font-size="12.5" fill="#334155">• <tspan font-weight="bold">多电平 ESS 扫频</tspan> (-24～0 dBFS)：锚定线性核 H₁ 与对角谐波趋势</text>
  <text x="86" y="406" font-size="12.5" fill="#334155">• <tspan font-weight="bold">随机相位多正弦 + 双脉冲</tspan>：满秩激发 ω₁±ω₂ 非对角交叉核</text>
  <text x="86" y="430" font-size="12.5" fill="#334155">• <tspan font-weight="bold">阶梯正弦突发 (Tone Burst)</tspan>：测定 Attack/Release 时间常数</text>
  <text x="86" y="454" font-size="12.5" fill="#334155">• <tspan font-weight="bold">真实干声素材</tspan> (鼓组/贝斯/人声/母带总线)：检验跨分布泛化能力</text>
  <text x="86" y="476" font-size="12" font-weight="bold" fill="#0369A1">• 预处理：亚采样互相关对齐 + Washout 预热窗标记</text>

  <rect x="68" y="500" width="420" height="196" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="86" y="526" font-size="14" font-weight="bold" fill="#92400E">2. 按算子带宽定制的三路抗混叠总线：</text>
  <rect x="86" y="540" width="384" height="42" rx="6" fill="#FFFFFF" stroke="#7DD3FC"/>
  <text x="100" y="558" font-size="12.5" font-weight="bold" fill="#075985">支路 A (1× 基带 f_s)：线性 FIR H₁ + 慢包络状态 s_env[n]</text>
  <text x="100" y="574" font-size="11.5" fill="#475569">无频谱展宽，基带直接运行（加 0.5 采样全通对齐 ADAA）</text>

  <rect x="86" y="590" width="384" height="42" rx="6" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="100" y="608" font-size="12.5" font-weight="bold" fill="#92400E">支路 B (1×/2× + ADAA1)：静态正交多项式 / 分段三次软削波</text>
  <text x="100" y="624" font-size="11.5" fill="#475569">Hopman–Bennett 无分母反导数公式消除除零奇异与高频折叠</text>

  <rect x="86" y="640" width="384" height="42" rx="6" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="100" y="658" font-size="12.5" font-weight="bold" fill="#5B21B6">支路 C (4× 过采样)：非对角交叉核 V2-L + Play 磁滞 + 神经残差</text>
  <text x="100" y="674" font-size="11.5" fill="#475569">多相半带 FIR 抽取/插值，容纳 p·f_max 频带展宽</text>

  <rect x="68" y="710" width="420" height="152" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="86" y="736" font-size="14" font-weight="bold" fill="#0F172A">3. 能量守恒与无源性硬约束接口：</text>
  <text x="86" y="762" font-size="12.5" fill="#334155">• 奇函数单调斜率约束：0 ≤ f'(x) ≤ L_max</text>
  <text x="86" y="786" font-size="12.5" fill="#334155">• 状态收缩投影：‖A_s‖₂ &lt; 1，严防高电平自激</text>
  <text x="86" y="810" font-size="12.5" fill="#334155">• 过载渐近钳位：|x| &gt; R_c 时平滑切换至 Padé 水平渐近线</text>
  <text x="86" y="836" font-size="12.5" font-weight="bold" fill="#059669">• 输出：相位严格对齐的多支路特征张量流</text>

  
  <rect x="552" y="330" width="496" height="532" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="800" y="356" text-anchor="middle" font-size="13.8" font-weight="bold" fill="#065F46">混合模型前向信号流：ŷ[n] = y_lin + y_poly + y_V2L + y_state + α·y_NN</text>

  
  <rect x="576" y="374" width="448" height="68" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="596" y="398" font-size="13.5" font-weight="bold" fill="#075985">① 线性主干支路：y_lin[n] = ∑_{k=0}^{M₁-1} h₁[k] · x[n-k]</text>
  <text x="596" y="422" font-size="12" fill="#0369A1">吸收硬件变压器/耦合电容的基准频响与相位色散（承担 &gt;85% 信号能量）</text>

  
  <rect x="576" y="454" width="448" height="68" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="596" y="478" font-size="10.8" font-weight="bold" fill="#92400E">② 正交静态与对角支路：y_poly[n] = ∑_{p=2}^P c_p · ADAA₁( P_p(x) )[n]</text>
  <text x="596" y="502" font-size="12" fill="#B45309">移位 Legendre 正交基解耦奇偶次谐波 + 无分母 ADAA1 抗混叠软饱和</text>

  
  <rect x="576" y="534" width="448" height="76" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="596" y="558" font-size="10.5" font-weight="bold" fill="#5B21B6">③ Laguerre 二阶/三阶交叉核：y_V2L[n] = u[n]ᵀ C₂ u[n] + ∑ r_m (w_mᵀ u)³</text>
  <text x="596" y="580" font-size="10.8" fill="#6D28D9">K=8 阶一阶全通正交级联状态 u_j[n]，以 36 个参数精准捕捉中短时双音互调记忆</text>
  <text x="596" y="598" font-size="11.5" fill="#475569">递推复杂度仅 O(K) 乘加/样本，彻底消除 O(M²) 维度灾难</text>

  
  <rect x="576" y="622" width="448" height="84" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="596" y="646" font-size="10.8" font-weight="bold" fill="#065F46">④ 显式物理状态支路：RD-Play 磁滞算子簇 + 双线性状态空间 (Bilinear SSM)</text>
  <text x="596" y="668" font-size="11.3" fill="#047857">• 速率相关 Play 算子 p_m[n]：复现磁带/变压器剩磁回线与高频涡流损耗展宽</text>
  <text x="596" y="688" font-size="11.1" fill="#047857">• 双线性项 N·s_env[n]·x[n]：显式表征慢包络引发的动态偏置漂移与增益压缩</text>

  
  <rect x="576" y="718" width="448" height="76" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="596" y="742" font-size="11.1" font-weight="bold" fill="#991B1B">⑤ 能量受限神经残差支路：α · f_NN( x[n], s_env[n] ; θ_NN )  (|α| ≤ 0.15)</text>
  <text x="596" y="764" font-size="12" fill="#B91C1C">仅拟合白盒主干剩余的 &lt;10% 高阶瞬态残差 e[n] = y_true - y_white</text>
  <text x="596" y="782" font-size="11.5" fill="#475569">网络规模可缩减 80%（如 16 维轻量 GRU 或 4 层 Micro-WaveNet）</text>

  
  <rect x="576" y="806" width="448" height="42" rx="8" fill="#0F172A"/>
  <text x="800" y="832" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#38BDF8">⊕ 相位对齐汇总输出 ŷ[n]  （白盒可解释度 &gt; 90%，总 THD+N 逼近硬件本底）</text>

  
  <rect x="1112" y="330" width="420" height="172" rx="10" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="1130" y="356" font-size="14" font-weight="bold" fill="#5B21B6">阶段 A：两步解耦训练法 (Two-Stage Training)</text>
  <text x="1130" y="382" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#059669">Step 1 (凸回归锚定主干)</tspan>：冻结神经支路 α=0，通过加权</text>
  <text x="1144" y="402" font-size="12.5" fill="#334155">Ridge 闭式解一步求出 H₁, c_p, C₂, Play 权重，锁定全局基底</text>
  <text x="1130" y="426" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#7C3AED">Step 2 (残差正交训练)</tspan>：在残差信号 e[n] 上训练轻量 f_NN，</text>
  <text x="1144" y="446" font-size="12.5" fill="#334155">施加正交约束 L_orth = ‖Φᵀ y_NN‖₂² 防止神经支路侵占主干</text>
  <text x="1130" y="472" font-size="12.5" fill="#334155">• <tspan font-weight="bold">Step 3 (低学习率联合微调)</tspan>：端到端最小化 ESR + MR-STFT</text>

  <rect x="1112" y="516" width="420" height="184" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="1130" y="542" font-size="14" font-weight="bold" fill="#065F46">阶段 B：离线高容量教师 → 实时学生知识蒸馏</text>
  <rect x="1130" y="556" width="384" height="52" rx="6" fill="#FFFFFF" stroke="#059669"/>
  <text x="1322" y="578" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#065F46">离线教师 (Teacher)：高维 V3 + RD-Play + 64ch WaveNet</text>
  <text x="1322" y="598" text-anchor="middle" font-size="11.5" fill="#047857">不计算力在 8× 过采样下高精度复刻模拟硬件 (ESR &lt; 0.2%)</text>
  <line x1="1322" y1="608" x2="1322" y2="628" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="1410" y="622" font-size="10.5" font-weight="bold" fill="#065F46">无限生成合成激励数据</text>
  <rect x="1130" y="632" width="384" height="54" rx="6" fill="#FFFFFF" stroke="#0284C7"/>
  <text x="1322" y="654" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#075985">实时学生 (Student)：精简 V2-L + ADAA + Bilinear SSM</text>
  <text x="1322" y="674" text-anchor="middle" font-size="11.5" fill="#0369A1">零神经推理开销，单核 CPU &lt; 2%，复现教师 97% 听感细节</text>

  <rect x="1112" y="714" width="420" height="148" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="1130" y="740" font-size="14" font-weight="bold" fill="#92400E">阶段 C：双误差审计准则 (Error Decomposition)</text>
  <text x="1130" y="766" font-size="11.3" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#78350F">‖y_HW - y_S‖ ≤ ‖y_HW - y_T‖ (E_HW→T) + ‖y_T - y_S‖ (E_T→S)</text>
  <text x="1130" y="792" font-size="12.5" fill="#334155">• 若 E_HW→T 大：说明缺少物理算子（需补磁滞或慢包络状态）</text>
  <text x="1130" y="816" font-size="12.5" fill="#334155">• 若 E_T→S 大：说明学生阶数 K 或低秩秩数 R 压缩过度</text>
  <text x="1130" y="840" font-size="12.5" font-weight="bold" fill="#B45309">• 定量区分物理结构误差 E_HW→T 与实时压缩误差 E_T→S</text>


  
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="15.5" font-weight="bold" fill="#F8FAFC">核心结论：把线性频响、短时交叉核、慢包络与剩磁分别交给最契合的数学算子，让神经网络只修补 &lt;10% 的高阶残差，并在部署前经教师-学生蒸馏消除实时推理瓶颈。</text>
</svg>
