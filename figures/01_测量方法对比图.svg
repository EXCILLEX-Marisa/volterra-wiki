    <text x="242" y="388" text-anchor="middle" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#7C3AED">改变脉冲间隔 d = 1, 2, ... 即可扫描非对角坐标 h₂[n, n-d]</text>
    <text x="32" y="438" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">能观察到什么：</text>
    <text x="32" y="468" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">• 通过 Δ[n] = y_AB − y_A − y_B + y_0 直接检验交叉记忆</text>
    <text x="32" y="494" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">• 定量定位哪些历史间隔 d 具有显著非对角交互</text>
    <rect x="28" y="535" width="428" height="168" rx="10" fill="#EDE9FE" stroke="#C4B5FD"/>
    <text x="44" y="565" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#7C3AED">局限与实验要求：</text>
    <text x="44" y="594" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">• 若系统含三阶/四阶交叉项，双脉冲差值中仍会混有高阶项，</text>
    <text x="44" y="620" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">  需配合多组幅度 (A, B) 组合才能完全解耦二阶核；</text>
    <text x="44" y="646" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">• 遍历所有间隔 d 的测量耗时较长，适合定点验证与诊断。</text>
  </g>
  <g transform="translate(1068, 144)">
    <rect x="0" y="0" width="484" height="730" rx="16" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="484" height="54" rx="16" fill="#FEF3C7"/>
    <text x="242" y="35" text-anchor="middle" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#D97706">3. 指数正弦扫频（ESS / Farina-Novák）</text>
    <rect x="28" y="70" width="428" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="242" y="97" text-anchor="middle" font-size="17" font-weight="bold" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#0F172A">x(t) = A cos[φ_exp(t)]</text>
    <rect x="28" y="128" width="428" height="275" rx="12" fill="#F8FAFC" stroke="#FCD34D"/>
    <text x="242" y="154" text-anchor="middle" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#D97706">解卷积时间轴：在负延迟区分离各次谐波脉冲响应 HHIR</text>
    <line x1="55" y1="315" x2="430" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)"/>
    <path d="M 95 315 L 105 255 L 115 330 L 128 295 L 145 315" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="115" y="242" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#7C3AED">H_H3 (三次)</text>
    <path d="M 195 315 L 208 235 L 220 335 L 235 285 L 255 315" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <text x="215" y="222" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#D97706">H_H2 (二次)</text>
    <path d="M 320 315 L 335 185 L 350 345 L 368 265 L 390 308 L 415 315" fill="none" stroke="#0284C7" stroke-width="3"/>
    <text x="345" y="175" text-anchor="middle" font-size="13" font-weight="bold" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#0284C7">H_H1 (基波 t=0)</text>
    <text x="242" y="388" text-anchor="middle" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#D97706">一次扫频同时提取多阶谐波随频率的幅相轮廓（高信噪比）</text>
    <text x="32" y="438" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">能观察到什么：</text>
    <text x="32" y="468" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">• 各次谐波通道 H_Hm(f) 的频率响应与相位特征</text>
    <text x="32" y="494" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">• 经上三角阶次变换可辨识并联 Hammerstein 支路核 g_p[k]</text>
    <rect x="28" y="535" width="428" height="168" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="44" y="565" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#D97706">核心能力边界（切勿混淆）：</text>
    <text x="44" y="594" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">• ESS 分离出的 H_Hm 不是完整高维非对角 Volterra 核；</text>
    <text x="44" y="620" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">• 单音扫频无法唯一拆开非线性前置滤波 P(f) 与后置滤波</text>
    <text x="44" y="646" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">  Q(mf)，必须结合双音互调与瞬态实验作独立交叉验证。</text>
  </g>
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#F8FAFC">核心要义：单脉冲只能看主对角线混合，ESS 擅长高效辨识对角/并联 Hammerstein 支路，双脉冲与多音激励则是检验非对角交叉记忆的利器。</text>
</svg>
