    <text x="242" y="388" text-anchor="middle" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#DC2626">盲区：k₁ ≠ k₂ 的非对角格全部为 0，且各阶对角项混叠</text>
    <text x="32" y="438" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">能观察到什么：</text>
    <text x="32" y="468" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">• 线性系统的完整脉冲响应 h₁[n]</text>
    <text x="32" y="494" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">• 各阶主对角线在时刻 n 的混合和 Σ A^p h_p[n,...,n]</text>
    <rect x="28" y="535" width="428" height="168" rx="10" fill="#FEE2E2" stroke="#FCA5A5"/>
    <text x="44" y="565" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#DC2626">局限与误区：</text>
    <text x="44" y="594" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">• 因 δ[n-k₁]δ[n-k₂] 仅当 k₁=k₂=n 时非零，单脉冲从数学</text>
    <text x="44" y="620" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">  上根本不会触发任何跨时刻乘积项；</text>
    <text x="44" y="646" font-size="14" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">• 单脉冲能量集中在一点，实测硬件时信噪比（SNR）极低。</text>
  </g>
  <g transform="translate(558, 144)">
    <rect x="0" y="0" width="484" height="730" rx="16" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="484" height="54" rx="16" fill="#EDE9FE"/>
    <text x="242" y="35" text-anchor="middle" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#7C3AED">2. 双脉冲差分扫描（Twin-Impulse）</text>
    <rect x="28" y="70" width="428" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="242" y="97" text-anchor="middle" font-size="17" font-weight="bold" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#0F172A">x[n] = A·δ[n] + B·δ[n-d]</text>
    <rect x="28" y="128" width="428" height="275" rx="12" fill="#F8FAFC" stroke="#C4B5FD"/>
    <text x="242" y="154" text-anchor="middle" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#7C3AED">在二阶核平面 (k₁, k₂) 上点亮的区域：逐条次对角线</text>
    <rect x="140" y="175" width="29" height="29" rx="4" fill="#CBD5E1" stroke="#FFF"/>
    <rect x="172" y="175" width="29" height="29" rx="4" fill="#EDE9FE" stroke="#FFF"/>
