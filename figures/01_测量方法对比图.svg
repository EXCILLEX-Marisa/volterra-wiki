  <text x="216" y="70" font-size="28" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0F172A">单脉冲、双脉冲扫描与指数正弦扫频（ESS）的可辨识域对比</text>
  <text x="68" y="104" font-size="16" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#475569">不同测试激励能“照亮”的 Volterra 核坐标区域截然不同：单脉冲只踩主对角线，双脉冲探测非对角网格，ESS 高效分离频域谐波通道</text>
  <g transform="translate(48, 144)">
    <rect x="0" y="0" width="484" height="730" rx="16" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="484" height="54" rx="16" fill="#E0F2FE"/>
    <text x="242" y="35" text-anchor="middle" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0284C7">1. 单脉冲激励（Single Impulse）</text>
    <rect x="28" y="70" width="428" height="42" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="242" y="97" text-anchor="middle" font-size="17" font-weight="bold" font-family="DejaVu Serif, Georgia, Times New Roman, serif" fill="#0F172A">x[n] = A · δ[n]</text>
    <rect x="28" y="128" width="428" height="275" rx="12" fill="#F8FAFC" stroke="#7DD3FC"/>
    <text x="242" y="154" text-anchor="middle" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#0284C7">在二阶核平面 (k₁, k₂) 上点亮的区域：仅主对角线</text>
