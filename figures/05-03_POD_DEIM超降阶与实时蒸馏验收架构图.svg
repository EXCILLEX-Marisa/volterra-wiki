<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="vBlur"/>
      <feOffset in="vBlur" dx="0" dy="3" result="vOffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  
  <rect width="1600" height="980" fill="#F8FAFC"/>

  
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="248" height="28" rx="6" fill="#0F172A"/>
  <text x="192.2" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 05-03 · 超降阶与实时验收规范</text>
  <text x="332" y="70" font-size="27" font-weight="bold" fill="#0F172A">POD + DEIM 超降阶 (Hyper-Reduction) 与实时音频插件五层渐进验收规范架构图</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">上半图沿着有限元网格、选定节点与模态力计算。下半图的 L1—L5 与第 5.14 节逐项对应。</text>


  
    <rect x="48" y="144" width="1504" height="360" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="144" width="1504" height="54" rx="14" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="48" y="186" width="1504" height="12" fill="#EDE9FE"/>
  <line x1="48" y1="198" x2="1552" y2="198" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="68" y="168" font-size="17" font-weight="bold" fill="#5B21B6">上篇：高维声学 PDE / 有限元 (FEM) 模态降阶与 DEIM 离散经验插值超降阶 (Hyper-Reduction)</text>
  <text x="68" y="188" font-size="12.5" fill="#5B21B6">离线选择插值点，实时只计算所需的力分量；局部力的依赖范围决定需要重建哪些节点。</text>

  
  
  <rect x="68" y="210" width="440" height="276" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="86" y="236" font-size="13.2" font-weight="bold" fill="#991B1B">① 原始有限元全阶网格 (Full-Order FEM, N = 10⁴～10⁵ 自由度)</text>
  
  <rect x="86" y="250" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#DC2626"/>
  <ellipse cx="176" cy="305" rx="70" ry="42" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <ellipse cx="176" cy="305" rx="44" ry="26" fill="none" stroke="#DC2626" stroke-width="1" stroke-dasharray="2 2"/>
  <ellipse cx="176" cy="305" rx="18" ry="11" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="106" y1="305" x2="246" y2="305" stroke="#DC2626" stroke-width="0.8"/>
  <line x1="176" y1="263" x2="176" y2="347" stroke="#DC2626" stroke-width="0.8"/>
  <line x1="126" y1="275" x2="226" y2="335" stroke="#DC2626" stroke-width="0.8"/>
  <line x1="126" y1="335" x2="226" y2="275" stroke="#DC2626" stroke-width="0.8"/>
  <text x="278" y="274" font-size="10.9" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#7F1D1D">M q̈ + C q̇ + K q + fₙₗ(q) = b u</text>
  <text x="278" y="298" font-size="12" fill="#334155">• 纸盆盆架大振幅几何硬化</text>
  <text x="278" y="320" font-size="12" fill="#334155">• 板式混响器 (Plate) 张力耦合</text>
  <text x="278" y="344" font-size="12" font-weight="bold" fill="#DC2626">• 网格越密，逐点求力的开销越大</text>

  <text x="86" y="384" font-size="12.5" font-weight="bold" fill="#991B1B">标准 POD 投影的「提升瓶颈 (Lifting Bottleneck)」：</text>
  <text x="86" y="406" font-size="12" fill="#334155">即使令 q ≈ V_r a (r = 20 ≪ N)，计算非线性内力项</text>
  <text x="86" y="426" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#991B1B">f_r_nl(a) = V_rᵀ · f_nl( V_r · a )</text>
  <text x="86" y="448" font-size="12" fill="#334155">若在求力前还原完整网格，例如 N=50,000，</text>
  <text x="86" y="468" font-size="12" font-weight="bold" fill="#DC2626">每一步仍需处理全部网格自由度。</text>

  <line x1="508" y1="348" x2="536" y2="348" stroke="#7C3AED" stroke-width="3" marker-end="url(#arr-purple)"/>

  
  <rect x="540" y="210" width="496" height="276" rx="10" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="558" y="236" font-size="14" font-weight="bold" fill="#5B21B6">② DEIM 离散经验插值超降阶 (Chaturantabut &amp; Sorensen 2010)</text>
  <text x="558" y="260" font-size="12.5" fill="#334155">• 对非线性力快照做 SVD 得基 U_m ∈ ℝ^(N×m)，用贪心行主元选择仅</text>
  <text x="558" y="280" font-size="12.5" font-weight="bold" fill="#6D28D9">  m = 20～40 个空间关键插值点 (Magic Points，选择矩阵 P ∈ ℝ^(N×m))：</text>

  <rect x="558" y="294" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="788" y="318" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#5B21B6">fᵣ(a) ≈ [Vᵣᵀ Uₘ (Pᵀ Uₘ)⁻¹] [Pᵀ fₙₗ(Vᵣ a)]</text>
  <text x="788" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">第一项可在离线阶段计算；第二项只需选出的力分量。</text>

  
  <rect x="558" y="372" width="180" height="98" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
  <ellipse cx="648" cy="421" rx="66" ry="38" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.2"/>
  <circle cx="648" cy="421" r="4.5" fill="#059669"/><circle cx="612" cy="408" r="4.5" fill="#059669"/>
  <circle cx="684" cy="434" r="4.5" fill="#059669"/><circle cx="628" cy="442" r="4.5" fill="#059669"/>
  <circle cx="672" cy="402" r="4.5" fill="#059669"/><circle cx="594" cy="424" r="4.5" fill="#059669"/>
  <circle cx="702" cy="418" r="4.5" fill="#059669"/><circle cx="648" cy="386" r="4.5" fill="#059669"/>
  <text x="648" y="466" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#065F46">仅在 m 个插值点求值</text>

  <text x="752" y="394" font-size="12.5" fill="#334155">• 对逐点非线性力：</text>
  <text x="752" y="416" font-size="12" fill="#334155">先从模态坐标重建 m 个位移，</text>
  <text x="752" y="436" font-size="12" fill="#334155">再逐点求力并投影回 r 个模态。</text>
  <text x="752" y="456" font-size="12" font-weight="bold" fill="#5B21B6">若力依赖邻域，也要重建相邻节点。</text>

  <line x1="1036" y1="348" x2="1064" y2="348" stroke="#059669" stroke-width="3" marker-end="url(#arr-green)"/>

  
  <rect x="1068" y="210" width="464" height="276" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="1086" y="236" font-size="14" font-weight="bold" fill="#065F46">③ 模态耦合二阶/三阶核与实时二阶谐振器组</text>
  <rect x="1086" y="252" width="428" height="72" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="1300" y="276" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#065F46">ä_i + 2ζ_i ω_i ȧ_i + ω_i² a_i + ∑_{j,k} Γ_ijk a_j a_k</text>
  <text x="1300" y="298" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#047857">+ ∑_{j,k,l} Λ_ijkl a_j a_k a_l = b_r_i · u(t)</text>
  <text x="1300" y="316" text-anchor="middle" font-size="11" fill="#065F46">保守内力可由势能的偏导数构造；阻尼与外部驱动另计。</text>

  <text x="1086" y="350" font-size="12.5" fill="#334155">• <tspan font-weight="bold">物理诠释</tspan>：转化为 r = 16～32 个并联二阶 IIR 模态谐振器，加上</text>
  <text x="1100" y="370" font-size="12.5" fill="#334155">再加入模态之间的非线性力；这些乘积使用的是模态状态。</text>
  <text x="1086" y="396" font-size="12.5" fill="#334155">• <tspan font-weight="bold">适用对象</tspan>：弹簧混响 (Spring Reverb) 啁啾色散、锣镲/板式混响非</text>
  <text x="1100" y="416" font-size="12.5" fill="#334155">线性击打音高上滑 (Pitch Glide)、大冲程低音扬声器盆分裂失真</text>
  <text x="1086" y="444" font-size="12.5" font-weight="bold" fill="#059669">• 实时性：在指定宿主、采样率与缓冲区测量块耗时</text>

  
    <rect x="48" y="520" width="1504" height="362" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="520" width="1504" height="54" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="48" y="562" width="1504" height="12" fill="#F1F5F9"/>
  <line x1="48" y1="574" x2="1552" y2="574" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="68" y="544" font-size="17" font-weight="bold" fill="#0F172A">下篇：从硬件录音到目标 DAW 的五层验收</text>
  <text x="68" y="564" font-size="12.5" fill="#0F172A">同一测试音可跨层复用。每层先确定参照对象，再记录误差。</text>

  
  <rect x="68" y="586" width="276" height="276" rx="10" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1.5"/>
  <rect x="84" y="602" width="244" height="30" rx="6" fill="#0284C7"/>
  <text x="206" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">L1 物理校准</text>
  <text x="84" y="654" font-size="12" fill="#334155">• 参照对象：真实硬件的配对录音</text>
  <text x="96" y="672" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#075985">记录旋钮、电平、采样率和测量链</text>
  <text x="84" y="696" font-size="12" fill="#334155">• 时间与增益对齐后比较频响、</text>
  <text x="96" y="714" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#075985">谐波与双音互调</text>
  <text x="84" y="738" font-size="12" fill="#334155">• 用不同预激励重复同一探针，</text>
  <text x="96" y="756" font-size="11.5" fill="#334155">估计可重复的差异和噪声底</text>
  <text x="84" y="782" font-size="12" font-weight="bold" fill="#0369A1">• 保留录音和初始条件，供教师</text>
  <text x="96" y="800" font-size="11.5" fill="#075985">与学生分别对照</text>
  <rect x="84" y="820" width="244" height="26" rx="5" fill="#E0F2FE"/>
  <text x="206" y="838" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">记录：硬件与物理教师的差值</text>

  <rect x="360" y="586" width="276" height="276" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="376" y="602" width="244" height="30" rx="6" fill="#D97706"/>
  <text x="498" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">L2 数值收敛</text>
  <text x="376" y="654" font-size="12" fill="#334155">• 参照对象：解析解或经步长</text>
  <text x="388" y="672" font-size="11.5" fill="#334155">收敛检查的离线解</text>
  <text x="376" y="696" font-size="12" fill="#334155">• 减半步长，复算同一段输入，</text>
  <text x="388" y="714" font-size="11.5" fill="#334155">检查输出差异与方程残差</text>
  <text x="376" y="738" font-size="12" fill="#334155">• 大信号下核对输入功、储能</text>
  <text x="388" y="756" font-size="11.5" fill="#334155">和耗散的收支</text>
  <text x="376" y="782" font-size="12" font-weight="bold" fill="#B45309">• 记录 Newton 迭代次数、</text>
  <text x="388" y="800" font-size="11.5" fill="#92400E">收敛失败时的输入与初值</text>
  <rect x="376" y="820" width="244" height="26" rx="5" fill="#FEF3C7"/>
  <text x="498" y="838" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400E">记录：步长与数值误差的关系</text>

  <rect x="652" y="586" width="276" height="276" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="668" y="602" width="244" height="30" rx="6" fill="#7C3AED"/>
  <text x="790" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">L3 降阶与代理</text>
  <text x="668" y="654" font-size="12" fill="#334155">• 参照对象：已校准的高精度教师</text>
  <text x="680" y="672" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#5B21B6">对齐同一输入、控制量与初值</text>
  <text x="668" y="696" font-size="12" fill="#334155">• 改变模态数 r 和插值点数 m，</text>
  <text x="680" y="714" font-size="11.5" fill="#334155">比较非线性力与输出波形</text>
  <text x="668" y="738" font-size="12" fill="#334155">• 若替换元件曲线，核对单调性</text>
  <text x="680" y="756" font-size="11.5" fill="#334155">及斜率，检查训练区间边缘</text>
  <text x="668" y="782" font-size="12" font-weight="bold" fill="#6D28D9">• 在留出激励上复验近似误差，</text>
  <text x="680" y="800" font-size="11.5" fill="#5B21B6">同时记录每种模型的求值成本</text>
  <rect x="668" y="820" width="244" height="26" rx="5" fill="#EDE9FE"/>
  <text x="790" y="838" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5B21B6">记录：教师与实时代理的差值</text>

  <rect x="944" y="586" width="276" height="276" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="960" y="602" width="244" height="30" rx="6" fill="#059669"/>
  <text x="1082" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">L4 闭环泛化</text>
  <text x="960" y="654" font-size="12" fill="#334155">• 参照对象：封存录音及压力激励</text>
  <text x="972" y="672" font-size="11.5" fill="#334155">使用未见过的电平、历史或旋钮</text>
  <text x="960" y="696" font-size="12" fill="#334155">• 让模型沿自己的状态连续运行，</text>
  <text x="972" y="714" font-size="11.5" fill="#334155">记录长序列的漂移与恢复</text>
  <text x="960" y="738" font-size="12" fill="#334155">• 复位后重复输入，检查初始</text>
  <text x="972" y="756" font-size="11.5" fill="#334155">条件对输出的影响</text>
  <text x="960" y="782" font-size="12" font-weight="bold" fill="#047857">• 分别检查旋钮插值和快速变化，</text>
  <text x="972" y="800" font-size="11.5" fill="#065F46">保留出错时的输入片段</text>
  <rect x="960" y="820" width="244" height="26" rx="5" fill="#D1FAE5"/>
  <text x="1082" y="838" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065F46">记录：自由运行和未见工况误差</text>

  <rect x="1236" y="586" width="296" height="276" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="1252" y="602" width="264" height="30" rx="6" fill="#DC2626"/>
  <text x="1384" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">L5 硬实时部署</text>
  <text x="1252" y="654" font-size="12" font-weight="bold" fill="#991B1B">• 参照对象：目标机器与 DAW</text>
  <text x="1264" y="674" font-size="11.5" fill="#334155">记录采样率、缓冲区、实例数</text>
  <text x="1276" y="692" font-size="11.5" fill="#334155">• 检查实时线程的分配、锁与 I/O</text>
  <text x="1264" y="714" font-size="11.5" fill="#334155">• 测量每块用时及掉音次数</text>
  <text x="1264" y="736" font-size="11.5" fill="#334155">同时记录静音、瞬态与旋钮变化</text>
  <text x="1252" y="762" font-size="12" font-weight="bold" fill="#065F46">• 与音频块的截止时间比较，</text>
  <text x="1264" y="782" font-size="11.5" fill="#334155">列出 99.9% 分位与实测最大值</text>
  <text x="1264" y="800" font-size="11.5" fill="#334155">并注明测试长度与负载</text>
  <rect x="1252" y="820" width="264" height="26" rx="5" fill="#FEE2E2"/>
  <text x="1384" y="838" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991B1B">记录：目标平台耗时与超时次数</text>


  
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="15.5" font-weight="bold" fill="#F8FAFC">读图顺序：先用选定节点近似非线性模态力，再分别验收物理校准、数值收敛、降阶误差、闭环泛化和实时部署。</text>
</svg>
