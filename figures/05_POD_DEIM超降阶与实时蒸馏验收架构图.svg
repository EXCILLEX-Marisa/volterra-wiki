    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="980" fill="#F8FAFC"/>

  <!-- Top Header Card -->
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="228" height="28" rx="6" fill="#0F172A"/>
  <text x="182.0" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 05-02 · 超降阶与实时验收规范</text>
  <text x="312" y="70" font-size="27" font-weight="bold" fill="#0F172A">POD + DEIM 超降阶 (Hyper-Reduction) 与实时音频插件五层渐进验收规范架构图</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">展示高维有限元/PDE 非线性力学模型的 Magic Points 超降阶路径，以及商业母带级插件从数学无源到实时线程安全的完整交付标准</text>


  <!-- Top Half: FEM / PDE Modal & POD Reduction + DEIM Hyper-Reduction -->
    <rect x="48" y="144" width="1504" height="360" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="144" width="1504" height="54" rx="14" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="48" y="186" width="1504" height="12" fill="#EDE9FE"/>
  <line x1="48" y1="198" x2="1552" y2="198" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="68" y="168" font-size="17" font-weight="bold" fill="{dark}">{title}</text>
  <text x="68" y="188" font-size="12.5" fill="{dark}">{subtitle}</text>

  <!-- 3-Step Pipeline inside Top Card -->
  <!-- Box 1: Full FEM Mesh -->
  <rect x="68" y="210" width="440" height="276" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="86" y="236" font-size="14" font-weight="bold" fill="#991B1B">① 原始有限元全阶网格 (Full-Order FEM, N = 10⁴～10⁵ 自由度)</text>
  <!-- Visual mesh grid with speaker cone / plate -->
  <rect x="86" y="250" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#DC2626"/>
  <ellipse cx="176" cy="305" rx="70" ry="42" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <ellipse cx="176" cy="305" rx="44" ry="26" fill="none" stroke="#DC2626" stroke-width="1" stroke-dasharray="2 2"/>
  <ellipse cx="176" cy="305" rx="18" ry="11" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="106" y1="305" x2="246" y2="305" stroke="#DC2626" stroke-width="0.8"/>
  <line x1="176" y1="263" x2="176" y2="347" stroke="#DC2626" stroke-width="0.8"/>
  <line x1="126" y1="275" x2="226" y2="335" stroke="#DC2626" stroke-width="0.8"/>
  <line x1="126" y1="335" x2="226" y2="275" stroke="#DC2626" stroke-width="0.8"/>
  <text x="278" y="274" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#7F1D1D">M q̈ + C q̇ + K q + f_nl(q) = b u</text>
  <text x="278" y="298" font-size="12" fill="#334155">• 纸盆盆架大振幅几何硬化</text>
  <text x="278" y="320" font-size="12" fill="#334155">• 板式混响器 (Plate) 张力耦合</text>
  <text x="278" y="344" font-size="12" font-weight="bold" fill="#DC2626">• 算力：48kHz 下需 10⁹ FLOPs/s</text>

  <text x="86" y="384" font-size="12.5" font-weight="bold" fill="#991B1B">⚠️ 标准 POD 投影的「提升瓶颈 (Lifting Bottleneck)」：</text>
  <text x="86" y="406" font-size="12" fill="#334155">即使令 q ≈ V_r a (r = 20 ≪ N)，计算非线性内力项</text>
  <text x="86" y="426" font-size="12" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#991B1B">f̃_nl(a) = V_rᵀ · f_nl( V_r · a )</text>
  <text x="86" y="448" font-size="12" fill="#334155">仍需每采样点先乘 V_r 还原至 N=50,000 个网格点求值，</text>
  <text x="86" y="468" font-size="12" font-weight="bold" fill="#DC2626">复杂度仍为 O(N)，导致 POD 降阶对非线性项完全失效！</text>

  <line x1="508" y1="348" x2="536" y2="348" stroke="#7C3AED" stroke-width="3" marker-end="url(#arr-purple)"/>

  <!-- Box 2: DEIM Magic Points Hyper-Reduction -->
  <rect x="540" y="210" width="496" height="276" rx="10" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="558" y="236" font-size="14" font-weight="bold" fill="#5B21B6">② DEIM 离散经验插值超降阶 (Chaturantabut &amp; Sorensen 2010)</text>
  <text x="558" y="260" font-size="12.5" fill="#334155">• 对非线性力快照做 SVD 得基 U_m ∈ ℝ^(N×m)，用贪心行主元选择仅</text>
  <text x="558" y="280" font-size="12.5" font-weight="bold" fill="#6D28D9">  m = 20～40 个空间关键插值点 (Magic Points，选择矩阵 P ∈ ℝ^(N×m))：</text>

  <rect x="558" y="294" width="460" height="68" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="788" y="318" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#5B21B6">f̃_nl(a) ≈ [ V_rᵀ U_m (Pᵀ U_m)⁻¹ ] · f_nl( (Pᵀ V_r) · a )</text>
  <text x="788" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">离线预乘 E_DEIM ∈ ℝ^(r×m) 与 V_sub = PᵀV_r ∈ ℝ^(m×r)！</text>

  <!-- Visual of Magic Points on Cone -->
  <rect x="558" y="372" width="180" height="98" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
  <ellipse cx="648" cy="421" rx="66" ry="38" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.2"/>
  <circle cx="648" cy="421" r="4.5" fill="#059669"/><circle cx="612" cy="408" r="4.5" fill="#059669"/>
  <circle cx="684" cy="434" r="4.5" fill="#059669"/><circle cx="628" cy="442" r="4.5" fill="#059669"/>
  <circle cx="672" cy="402" r="4.5" fill="#059669"/><circle cx="594" cy="424" r="4.5" fill="#059669"/>
  <circle cx="702" cy="418" r="4.5" fill="#059669"/><circle cx="648" cy="386" r="4.5" fill="#059669"/>
  <text x="648" y="466" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#065F46">仅在 m=30 个绿点求非线性力!</text>

  <text x="752" y="394" font-size="12.5" fill="#334155">• <tspan font-weight="bold" fill="#065F46">算力断崖式下降</tspan>：</text>
  <text x="752" y="416" font-size="12" fill="#334155">实时阶段彻底脱离原始网格维度 N，</text>
  <text x="752" y="436" font-size="12" fill="#334155">每采样点仅需计算 m=30 个标量点的</text>
  <text x="752" y="456" font-size="12" font-weight="bold" fill="#5B21B6">本构函数，复杂度降至 O(r·m) ≈ 600 次乘加！</text>

  <line x1="1036" y1="348" x2="1064" y2="348" stroke="#059669" stroke-width="3" marker-end="url(#arr-green)"/>

  <!-- Box 3: Modal Volterra / Real-Time State Synthesis -->
  <rect x="1068" y="210" width="464" height="276" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="1086" y="236" font-size="14" font-weight="bold" fill="#065F46">③ 模态耦合二阶/三阶核与实时二阶谐振器组</text>
  <rect x="1086" y="252" width="428" height="72" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="1300" y="276" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#065F46">ä_i + 2ζ_i ω_i ȧ_i + ω_i² a_i + ∑_{j,k} Γ_ijk a_j a_k</text>
  <text x="1300" y="298" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-weight="bold" fill="#047857">+ ∑_{j,k,l} Λ_ijkl a_j a_k a_l = b̃_i · u(t)</text>
  <text x="1300" y="316" text-anchor="middle" font-size="11" fill="#065F46">(由势能泛函 U(a) 偏导对称生成 Γ_ijk，保证模态间能量交換守恒)</text>

  <text x="1086" y="350" font-size="12.5" fill="#334155">• <tspan font-weight="bold">物理诠释</tspan>：转化为 r = 16～32 个并联二阶 IIR 模态谐振器，加上</text>
  <text x="1100" y="370" font-size="12.5" fill="#334155">稀疏模态交叉乘积项（等效于模态坐标下的紧凑 Volterra 展开！）</text>
  <text x="1086" y="396" font-size="12.5" fill="#334155">• <tspan font-weight="bold">适用对象</tspan>：弹簧混响 (Spring Reverb) 啁啾色散、锣镲/板式混响非</text>
  <text x="1100" y="416" font-size="12.5" fill="#334155">线性击打音高上滑 (Pitch Glide)、大冲程低音扬声器盆分裂失真</text>
  <text x="1086" y="444" font-size="12.5" font-weight="bold" fill="#059669">• 实时表现：单核 CPU 占用 &lt; 2%，支持实时调节张力、阻尼与尺寸旋钮</text>

  <!-- Bottom Half: 5-Layer Real-Time Verification & Thread-Safety Protocol -->
    <rect x="48" y="520" width="1504" height="362" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="48" y="520" width="1504" height="54" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
