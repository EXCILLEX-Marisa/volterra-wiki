  <!-- 5 Verification Pillars -->
  <rect x="68" y="586" width="276" height="276" rx="10" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1.5"/>
  <rect x="84" y="602" width="244" height="30" rx="6" fill="#0284C7"/>
  <text x="206" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">第 1 层：解析与物理守恒验收</text>
  <text x="84" y="654" font-size="12" fill="#334155">• <tspan font-weight="bold">能量无源性</tspan>：离散能量增量</text>
  <text x="96" y="672" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#075985">ΔH[n] ≤ u[n]·y[n]</text>
  <text x="84" y="696" font-size="12" fill="#334155">• <tspan font-weight="bold">状态收缩</tspan>：雅可比谱半径</text>
  <text x="96" y="714" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#075985">sup_s ρ(∂F/∂s) ≤ 1 - ε</text>
  <text x="84" y="738" font-size="12" fill="#334155">• <tspan font-weight="bold">奇偶对称性</tspan>：偏置 x₀=0 时</text>
  <text x="96" y="756" font-size="11.5" fill="#334155">对称拓扑偶次核严格归零</text>
  <text x="84" y="782" font-size="12" font-weight="bold" fill="#0369A1">• 渐近饱和：|x| → +20 dBFS</text>
  <text x="96" y="800" font-size="11.5" fill="#075985">输出有界不发散 (Padé 保护)</text>
  <rect x="84" y="820" width="244" height="26" rx="5" fill="#E0F2FE"/>
  <text x="206" y="838" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#075985">指标：零自激 / 零多项式爆炸</text>

  <rect x="360" y="586" width="276" height="276" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="376" y="602" width="244" height="30" rx="6" fill="#D97706"/>
  <text x="498" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">第 2 层：数值与边界压力测试</text>
  <text x="376" y="654" font-size="12" fill="#334155">• <tspan font-weight="bold"> +12 dBFS 满幅方波冲击</tspan>：</text>
  <text x="388" y="672" font-size="11.5" fill="#334155">检验牛顿/LUT 边界外推无 NaN</text>
  <text x="376" y="696" font-size="12" fill="#334155">• <tspan font-weight="bold">静音衰减 (1e-30 极小信号)</tspan>：</text>
  <text x="388" y="714" font-size="11.5" fill="#334155">检验 FTZ/DAZ 防次正规数尖峰</text>
  <text x="376" y="738" font-size="12" fill="#334155">• <tspan font-weight="bold">全采样率扫描</tspan>：44.1 / 48 /</text>
  <text x="388" y="756" font-size="11.5" fill="#334155">88.2 / 96 / 192 kHz 频响一致性</text>
  <text x="376" y="782" font-size="12" font-weight="bold" fill="#B45309">• 快速旋钮狂拧测试：</text>
  <text x="388" y="800" font-size="11.5" fill="#92400E">一阶参数平滑器消除拉链噪音</text>
  <rect x="376" y="820" width="244" height="26" rx="5" fill="#FEF3C7"/>
  <text x="498" y="838" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400E">指标：24 小时压力运行零爆音</text>

  <rect x="652" y="586" width="276" height="276" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="668" y="602" width="244" height="30" rx="6" fill="#7C3AED"/>
  <text x="790" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">第 3 层：时频域与抗混叠指标</text>
  <text x="668" y="654" font-size="12" fill="#334155">• <tspan font-weight="bold">波形误差比 (ESR)</tspan>：</text>
  <text x="680" y="672" font-size="11.5" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" fill="#5B21B6">ESR_val &lt; 0.5% (-23 dB)</text>
  <text x="668" y="696" font-size="12" fill="#334155">• <tspan font-weight="bold">多分辨率 STFT 谱误差</tspan>：</text>
  <text x="680" y="714" font-size="11.5" fill="#334155">覆盖 512 / 2048 / 8192 窗长</text>
  <text x="668" y="738" font-size="12" fill="#334155">• <tspan font-weight="bold">双音互调 (IMD)</tspan>：19+20 kHz</text>
  <text x="680" y="756" font-size="11.5" fill="#334155">差频 1 kHz 幅度误差 &lt; 0.5 dB</text>
  <text x="668" y="782" font-size="12" font-weight="bold" fill="#6D28D9">• 混叠镜像抑制比 (ASR)：</text>
  <text x="680" y="800" font-size="11.5" fill="#5B21B6">高频正弦扫频折叠伪影 &lt; -80 dBFS</text>
  <rect x="668" y="820" width="244" height="26" rx="5" fill="#EDE9FE"/>
  <text x="790" y="838" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5B21B6">指标：全面通过 VISTA 客观基准</text>

  <rect x="944" y="586" width="276" height="276" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="960" y="602" width="244" height="30" rx="6" fill="#059669"/>
  <text x="1082" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">第 4 层：双误差审计与盲听</text>
  <text x="960" y="654" font-size="12" fill="#334155">• <tspan font-weight="bold">教师误差 E_HW→T</tspan>：硬件与</text>
  <text x="972" y="672" font-size="11.5" fill="#334155">高维离线教师模型的物理差距</text>
  <text x="960" y="696" font-size="12" fill="#334155">• <tspan font-weight="bold">蒸馏误差 E_T→S</tspan>：离线教师</text>
  <text x="972" y="714" font-size="11.5" fill="#334155">压缩至实时学生模型的近似损耗</text>
  <text x="960" y="738" font-size="12" fill="#334155">• <tspan font-weight="bold">Null Test 相位抵消测试</tspan>：</text>
  <text x="972" y="756" font-size="11.5" fill="#334155">检验微秒级群延迟是否完全对齐</text>
  <text x="960" y="782" font-size="12" font-weight="bold" fill="#047857">• MUSHRA 双盲听感评测：</text>
  <text x="972" y="800" font-size="11.5" fill="#065F46">鼓组瞬态冲击感与低频下潜盲测</text>
  <rect x="960" y="820" width="244" height="26" rx="5" fill="#D1FAE5"/>
  <text x="1082" y="838" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065F46">指标：MUSHRA 得分 &gt; 90 / 100</text>

  <rect x="1236" y="586" width="296" height="276" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="1252" y="602" width="264" height="30" rx="6" fill="#DC2626"/>
  <text x="1384" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">第 5 层：实时线程安全红线</text>
  <text x="1252" y="654" font-size="12" font-weight="bold" fill="#991B1B">✗ processBlock 严禁事项：</text>
  <text x="1264" y="674" font-size="11.5" fill="#334155">1. 严禁堆内存分配 (new / malloc /</text>
  <text x="1276" y="692" font-size="11.5" fill="#334155">std::vector::push_back)</text>
  <text x="1264" y="714" font-size="11.5" fill="#334155">2. 严禁互斥锁 (std::mutex / lock)</text>
  <text x="1264" y="736" font-size="11.5" fill="#334155">3. 严禁系统调用、文件读写与日志</text>
  <text x="1252" y="762" font-size="12" font-weight="bold" fill="#065F46">✓ 标准实时架构：</text>
  <text x="1264" y="782" font-size="11.5" fill="#334155">• prepareToPlay 一次性预分配对齐内存</text>
  <text x="1264" y="800" font-size="11.5" fill="#334155">• UI 线程经 Lock-Free SPSC 队列传参</text>
  <rect x="1252" y="820" width="264" height="26" rx="5" fill="#FEE2E2"/>
  <text x="1384" y="838" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991B1B">指标：WCET &lt; 0.25 × Buffer 周期</text>


