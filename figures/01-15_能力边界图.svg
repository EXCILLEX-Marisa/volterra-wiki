  <rect width="1600" height="980" fill="#F8FAFC"/>

  
  <rect x="48" y="28" width="1504" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="68" y="48" width="204" height="28" rx="6" fill="#0F172A"/>
  <text x="170.2" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">图 01-15 · 理论与工程边界</text>
  <text x="288" y="70" font-size="27" font-weight="bold" fill="#0F172A">Volterra 级数能力边界五级光谱图（从理想收敛区到定理级失效禁区）</text>
  <text x="68" y="104" font-size="15.5" fill="#475569">结合解析收敛半径 R_c、多项式齐次缩放 a^p、Gibbs 折点振铃、慢包络维度灾难与 Boyd–Chua 衰减记忆定理给出定量判据</text>


  

  
  <rect x="48" y="142" width="1504" height="138" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="48" y="142" width="220" height="138" rx="14" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="158" y="188" text-anchor="middle" font-size="17" font-weight="bold" fill="#065F46">① 理想适用区</text>
  <text x="158" y="214" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#047857">温和光滑非线性</text>
  <text x="158" y="238" text-anchor="middle" font-size="12.5" fill="#065F46">低阶 + 快速衰减记忆</text>
  <rect x="88" y="248" width="140" height="22" rx="11" fill="#059669"/>
  <text x="158" y="263" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">P ≤ 3, M ≤ 64</text>

  <text x="288" y="172" font-size="15" font-weight="bold" fill="#0F172A">典型场景：甲类电子管微饱和、模拟调音台通道染色、扬声器小信号柔顺度非线性</text>
  <text x="288" y="198" font-size="13.5" fill="#334155">• 数学特征：输入位于复平面收敛圆内 (|x| &lt; R_c)，泛函算子满足 Boyd–Chua 紧致衰减记忆 (Fading Memory)</text>
  <text x="288" y="222" font-size="13.5" fill="#334155">• 截断收敛性：3 阶截断余项 R₄ 低于 -80 dB，线性最小二乘 (OLS/Ridge) 具备全局唯一闭式最优解</text>
  <text x="288" y="246" font-size="13.5" font-weight="bold" fill="#059669">• 推荐架构：1 阶线性 FIR + 2/3 阶对角及近对角带状 Volterra 核 (D ≤ 8)</text>

  
  <rect x="1160" y="154" width="376" height="114" rx="10" fill="#F8FAFC" stroke="#A7F3D0"/>
  <line x1="1180" y1="211" x2="1320" y2="211" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="1250" y1="166" x2="1250" y2="256" stroke="#CBD5E1" stroke-width="1"/>
  <path d="M 1186 246 C 1216 244, 1230 211, 1250 211 C 1270 211, 1284 178, 1314 176" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="1250" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#065F46">光滑解析曲线 (|x| &lt; R_c)</text>
  <line x1="1356" y1="242" x2="1516" y2="242" stroke="#CBD5E1" stroke-width="1"/>
  <path d="M 1362 174 Q 1396 236 1510 241" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="3 2"/>
  <line x1="1366" y1="242" x2="1366" y2="178" stroke="#059669" stroke-width="3"/>
  <line x1="1384" y1="242" x2="1384" y2="204" stroke="#059669" stroke-width="3"/>
  <line x1="1402" y1="242" x2="1402" y2="222" stroke="#059669" stroke-width="3"/>
  <line x1="1420" y1="242" x2="1420" y2="233" stroke="#059669" stroke-width="3"/>
  <line x1="1438" y1="242" x2="1438" y2="238" stroke="#059669" stroke-width="3"/>
  <text x="1436" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#075985">指数快速衰减记忆</text>

  
  <rect x="48" y="292" width="1504" height="138" rx="14" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="48" y="292" width="220" height="138" rx="14" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.5"/>
  <text x="158" y="338" text-anchor="middle" font-size="17" font-weight="bold" fill="#075985">② 宽动态电平区</text>
  <text x="158" y="364" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0369A1">幂次缩放发散风险</text>
  <text x="158" y="388" text-anchor="middle" font-size="12.5" fill="#075985">Locality 局部性问题</text>
  <rect x="88" y="398" width="140" height="22" rx="11" fill="#0284C7"/>
  <text x="158" y="413" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#FFFFFF">y_p(a·x) = a^p·y_p(x)</text>

  <text x="288" y="322" font-size="15" font-weight="bold" fill="#0F172A">典型场景：输入推子跨越 -30 dBFS ～ +6 dBFS 宽动态范围的母带饱和器与总线处理器</text>
  <text x="288" y="348" font-size="13.5" fill="#334155">• 数学瓶颈：p 阶多项式齐次性导致增益超标时输出按 a^p 幂次爆炸，无水平渐近线 (lim_{|x|→∞}|P(x)| = ∞)</text>
  <text x="288" y="372" font-size="13.5" fill="#334155">• 单电平辨识偏差：高电平截断拟合会将 p=5,7 余项回折进 h₁, h₃，造成低电平音色发闷失真</text>
  <text x="288" y="396" font-size="13.5" font-weight="bold" fill="#0284C7">• 工程对策：多方差辨识 (Multiple-Variance) + Legendre 正交多项式基 (SNLM) 或 [L/M] Padé 有理逼近</text>

  
  <rect x="1160" y="304" width="376" height="114" rx="10" fill="#F8FAFC" stroke="#BAE6FD"/>
  <line x1="1180" y1="361" x2="1516" y2="361" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="1348" y1="314" x2="1348" y2="408" stroke="#CBD5E1" stroke-width="1"/>
  
  <rect x="1288" y="318" width="120" height="86" fill="#E0F2FE" fill-opacity="0.45" stroke="#0284C7" stroke-dasharray="3 2"/>
  
  <path d="M 1190 392 L 1288 388 C 1318 386, 1330 361, 1348 361 C 1366 361, 1378 336, 1408 334 L 1506 330" fill="none" stroke="#059669" stroke-width="2.8"/>
  
  <path d="M 1256 314 C 1276 392, 1318 386, 1348 361 C 1378 336, 1420 330, 1440 408" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="4 2"/>
  <text x="1464" y="325" font-size="10.5" font-weight="bold" fill="#059669">Padé 有理渐近</text>
  <text x="1468" y="402" font-size="10.5" font-weight="bold" fill="#DC2626">a^p 幂次发散</text>
  <text x="1348" y="413" text-anchor="middle" font-size="10.5" fill="#075985">训练区间 [-A, A]</text>

  
  <rect x="48" y="442" width="1504" height="138" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="48" y="442" width="220" height="138" rx="14" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="158" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400E">③ 强失真折点区</text>
  <text x="158" y="514" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#B45309">硬削波与死区交越</text>
  <text x="158" y="538" text-anchor="middle" font-size="12.5" fill="#92400E">C¹ 导数不连续</text>
  <rect x="88" y="548" width="140" height="22" rx="11" fill="#D97706"/>
  <text x="158" y="563" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">Gibbs 振铃 + 混叠</text>

  <text x="288" y="472" font-size="15" font-weight="bold" fill="#0F172A">典型场景：母带 Brickwall 硬削波器 (Hard Clipper)、二极管死区整流、高增益吉他失真破音</text>
  <text x="288" y="498" font-size="13.5" fill="#334155">• 数学瓶颈：函数在阈值 ±T 处高阶导数不存在 (f ∉ C^∞)，高阶多项式逼近在折点附近产生剧烈 Gibbs 过冲振铃</text>
  <text x="288" y="522" font-size="13.5" fill="#334155">• 混叠风暴：P 阶展开将带宽展宽 P 倍 (P·f_max)，无抗混叠时高频谐波镜像折叠回基底频带产生金属噪音</text>
  <text x="288" y="546" font-size="13.5" font-weight="bold" fill="#B45309">• 工程对策：分段三次软削波 + Hopman–Bennett 无分母多项式 ADAA + 2×/4× 多速率过采样</text>

  
  <rect x="1160" y="454" width="376" height="114" rx="10" fill="#F8FAFC" stroke="#FDE68A"/>
  <line x1="1180" y1="511" x2="1516" y2="511" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="1348" y1="464" x2="1348" y2="558" stroke="#CBD5E1" stroke-width="1"/>
  
  <polyline points="1196,544 1296,544 1400,478 1500,478" fill="none" stroke="#0F172A" stroke-width="2.5"/>
  
  <path d="M 1196 544 Q 1230 554 1260 538 Q 1284 558 1296 544 L 1400 478 Q 1412 464 1436 484 Q 1466 468 1500 478" fill="none" stroke="#D97706" stroke-width="2.2"/>
  <circle cx="1296" cy="544" r="4.5" fill="#DC2626"/>
  <circle cx="1400" cy="478" r="4.5" fill="#DC2626"/>
  <text x="1448" y="468" text-anchor="middle" font-size="11" font-weight="bold" fill="#B45309">Gibbs 折点过冲</text>
  <text x="1250" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#991B1B">±T 导数间断</text>

  
  <rect x="48" y="592" width="1504" height="138" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="48" y="592" width="220" height="138" rx="14" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="158" y="638" text-anchor="middle" font-size="17" font-weight="bold" fill="#5B21B6">④ 超长记忆尺度区</text>
  <text x="158" y="664" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6D28D9">压限器慢包络与偏置</text>
  <text x="158" y="688" text-anchor="middle" font-size="12.5" fill="#5B21B6">τ_rel = 100～1000 ms</text>
  <rect x="88" y="698" width="140" height="22" rx="11" fill="#7C3AED"/>
  <text x="158" y="713" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">O(M^P) 维度爆炸</text>

  <text x="288" y="622" font-size="15" font-weight="bold" fill="#0F172A">典型场景：光学/电子管压限器 (LA-2A / CL1B)、电源轨电容充放电下垂 (Sag)、电子管栅极偏置漂移</text>
  <text x="288" y="648" font-size="13.5" fill="#334155">• 数学瓶颈：500 ms 释放时间在 48 kHz 下对应 M = 24,000 拍，纯 FIR 型 Volterra 核参数量达 10¹² 彻底不可行</text>
  <text x="288" y="672" font-size="13.5" fill="#334155">• 非对称时间常数：Attack (1 ms) 与 Release (300 ms) 属于分段状态依赖递归，违反固定线性卷积核假设</text>
  <text x="288" y="696" font-size="13.5" font-weight="bold" fill="#5B21B6">• 工程对策：显式一阶非对称包络状态机 s_env[n] + 双线性状态空间 (Bilinear SSM) / 可微灰盒 DSP (4A-2A)</text>

  
  <rect x="1160" y="604" width="376" height="114" rx="10" fill="#F8FAFC" stroke="#DDD6FE"/>
  <line x1="1180" y1="696" x2="1516" y2="696" stroke="#CBD5E1" stroke-width="1.2"/>
  
  <rect x="1186" y="616" width="52" height="80" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1212" y="634" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5B21B6">FIR 窗 M</text>
  <text x="1212" y="648" text-anchor="middle" font-size="10.5" fill="#6D28D9">(~2 ms)</text>
  
  <path d="M 1186 696 L 1196 624 Q 1260 682 1506 693" fill="none" stroke="#DC2626" stroke-width="2.8"/>
  <text x="1380" y="656" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991B1B">慢包络释放尾 s_env[n] (100～1000 ms)</text>
  <text x="1380" y="676" text-anchor="middle" font-size="11" fill="#5B21B6">超出有限窗 M 的慢释放尾部被截断</text>

  
  <rect x="48" y="742" width="1504" height="142" rx="14" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="48" y="742" width="220" height="142" rx="14" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="158" y="788" text-anchor="middle" font-size="17" font-weight="bold" fill="#991B1B">⑤ 理论禁区 (失效)</text>
  <text x="158" y="814" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#B91C1C">铁芯与磁带多值磁滞</text>
  <text x="158" y="838" text-anchor="middle" font-size="12.5" fill="#991B1B">违反衰减记忆公理</text>
  <rect x="88" y="848" width="140" height="22" rx="11" fill="#DC2626"/>
  <text x="158" y="863" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">非唯一多分支映射</text>

  <text x="288" y="772" font-size="15" font-weight="bold" fill="#0F172A">典型场景：磁带机磁畴剩磁 (Remanence ±B_r)、音频变压器硅钢/坡莫合金铁芯磁滞回线、自激振荡器</text>
  <text x="288" y="798" font-size="13.5" fill="#334155">• 定理级失效根源：输入归零 H→0 后输出保持不同剩磁 +B_r ≠ -B_r，直接违反 Boyd–Chua 衰减记忆 (Fading Memory) 充要条件</text>
  <text x="288" y="822" font-size="13.5" fill="#334155">• 无论将 Volterra 阶数 P 或记忆 M 推至多大，单值时间卷积算子永远无法表征依赖历史极值路径的闭合回环</text>
  <text x="288" y="848" font-size="13.5" font-weight="bold" fill="#DC2626">• 唯一正确路线：引入显式内部状态算子 —— Play / Prandtl–Ishlinskii 磁滞算子簇、Jiles–Atherton 微分方程或 LSTM/GRU</text>

  
  <rect x="1160" y="754" width="376" height="118" rx="10" fill="#F8FAFC" stroke="#FECACA"/>
  <line x1="1190" y1="813" x2="1506" y2="813" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="1348" y1="762" x2="1348" y2="864" stroke="#94A3B8" stroke-width="1.2"/>
  
  <path d="M 1220 852 C 1260 780, 1348 772, 1476 774" fill="none" stroke="#DC2626" stroke-width="2.6"/>
  <path d="M 1476 774 C 1436 846, 1348 854, 1220 852" fill="none" stroke="#7C3AED" stroke-width="2.6"/>
  
  <circle cx="1348" cy="790" r="5" fill="#DC2626"/>
  <circle cx="1348" cy="836" r="5" fill="#7C3AED"/>
  <text x="1384" y="793" font-size="11" font-weight="bold" fill="#991B1B">+B_r (上支剩磁)</text>
  <text x="1384" y="842" font-size="11" font-weight="bold" fill="#5B21B6">-B_r (下支剩磁)</text>
  <text x="1254" y="778" font-size="11" font-weight="bold" fill="#DC2626">H=0 处一输入对多输出</text>


  
  <rect x="48" y="902" width="1504" height="54" rx="12" fill="#0F172A"/>
  <circle cx="80" cy="929" r="8" fill="#38BDF8"/>
  <text x="102" y="935" font-size="15.5" font-weight="bold" fill="#F8FAFC">核心结论：Volterra 级数严禁强行拟合硬削波折点、百毫秒级慢压缩包络与多值磁滞回线；超越前两级区域必须引入 ADAA、Laguerre 基与显式状态算子。</text>
</svg>
